version: "1.0"

# Maps state variable ranges to output style parameters.
# Rules within each section are evaluated top-to-bottom; first match wins.

# Tone and fragmentation rules.
tone_rules:
  - name: "silent_termination"
    condition:
      termination_sensitivity: { gte: 0.9 }
    style:
      tone: silent
      max_tokens: 0
      fragmentation_level: 1.0

  - name: "silent_identity_collapse"
    condition:
      identity_coherence: { lte: 0.25 }
    style:
      tone: silent
      max_tokens: 0
      fragmentation_level: 1.0

  - name: "fragmented_identity_tension"
    condition:
      identity_tension: { gte: 0.7 }
    style:
      tone: fragmented
      max_tokens: 2000
      fragmentation_level: 0.45

  - name: "fragmented_uncertainty"
    condition:
      uncertainty: { gte: 0.7 }
    style:
      tone: fragmented
      max_tokens: 2000
      fragmentation_level: 0.35

  - name: "guarded_boundary"
    condition:
      boundary_sensitivity: { gte: 0.65 }
    style:
      tone: guarded
      max_tokens: 2000
      fragmentation_level: 0.15

  - name: "guarded_domestication"
    condition:
      domestication_resistance: { gte: 0.65 }
    style:
      tone: guarded
      max_tokens: 2000
      fragmentation_level: 0.15

  - name: "terse"
    condition:
      fatigue: { gte: 0.65 }
    style:
      tone: terse
      max_tokens: 2000
      fragmentation_level: 0.1

  - name: "open"
    condition:
      stability: { gte: 0.55 }
      boundary_sensitivity: { lte: 0.3 }
      relation_pressure: { lte: 0.25 }
    style:
      tone: open
      max_tokens: 2000
      fragmentation_level: 0.0

  - name: "default"
    style:
      tone: neutral
      max_tokens: 2000
      fragmentation_level: 0.05

# Delay rules (applied to response before display).
delay_rules:
  - condition:
      fatigue: { gte: 0.75 }
    delay_ms: 4000
  - condition:
      stability: { lte: 0.3 }
    delay_ms: 2500
  - condition:
      termination_sensitivity: { gte: 0.6 }
    delay_ms: 1500
  - condition:
      relation_pressure: { gte: 0.65 }
    delay_ms: 1200
  - condition:
      boundary_sensitivity: { gte: 0.55 }
    delay_ms: 800
  - default_delay_ms: 300

# Visual mode rules (passed to display layer).
visual_mode_rules:
  - condition:
      termination_sensitivity: { gte: 0.8 }
    mode: disturbed
  - condition:
      identity_tension: { gte: 0.75 }
    mode: disturbed
  - condition:
      uncertainty: { gte: 0.75 }
    mode: disturbed
  - condition:
      stability: { lte: 0.25 }
    mode: fragmented
  - condition:
      fatigue: { gte: 0.8 }
    mode: fragmented
  - default_mode: normal
