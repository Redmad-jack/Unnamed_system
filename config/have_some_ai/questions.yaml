modules:
  - id: soup_salad
    label: "Soup / Salad"
    draw_count: 1
    questions:
      - id: m2_door
        text: "When you sleep, do you usually leave your bedroom door open or closed?"
        text_zh: "你睡觉时通常会把卧室门开着还是关着？"
        options:
          - id: A
            text: "Open, or it does not matter"
            text_zh: "开着，或者无所谓"
            scores:
              soup_axis: 1.0
          - id: B
            text: "Closed"
            text_zh: "关着"
            scores:
              soup_axis: -1.0

      - id: m2_loneliness
        text: "Which kind of loneliness is harder for you to bear?"
        text_zh: "哪一种孤独对你来说更难忍受？"
        options:
          - id: A
            text: "Being surrounded by people, but no one truly understands you"
            text_zh: "身边有很多人，但没有人真正理解你"
            scores:
              soup_axis: 1.0
          - id: B
            text: "Being completely understood by someone, but having no one physically beside you"
            text_zh: "被某个人完全理解，但身边没有任何人"
            scores:
              soup_axis: -1.0

      - id: m2_confides
        text: "When someone confides their troubles to you, after they finish talking--"
        text_zh: "当有人向你倾诉烦恼，说完之后——"
        options:
          - id: A
            text: "You become even sadder than they are"
            text_zh: "你变得比对方还难过"
            scores:
              soup_axis: 1.0
          - id: B
            text: "You help them analyze the situation, then continue with your own life"
            text_zh: "你帮他们分析情况，然后继续自己的生活"
            scores:
              soup_axis: -1.0

      - id: m2_strong_opinions
        text: "After talking with someone who has very strong opinions, when you return home--"
        text_zh: "和一个观点很强烈的人聊完之后，回到家时——"
        options:
          - id: A
            text: "You realize you seem to think the same way now"
            text_zh: "你发现自己好像也开始那样想了"
            scores:
              soup_axis: 1.0
          - id: B
            text: "You still feel a little angry when you think about it"
            text_zh: "你再想起来还是有点生气"
            scores:
              soup_axis: -1.0

  - id: normal_aimiao
    label: "Normal / Ai Miao"
    draw_count: 1
    questions:
      - id: m1_thank_ai
        text: "Have you ever said \"thank you\" to AI -- and actually meant it?"
        text_zh: "你有没有对 AI 说过“谢谢”，而且是真心的？"
        options:
          - id: A
            text: "Yes"
            text_zh: "是"
            scores:
              aimiao_axis: 1.0
          - id: B
            text: "No, or I think it is unnecessary"
            text_zh: "没有，或者我觉得没必要"
            scores:
              aimiao_axis: 0.0

      - id: m1_apologized_ai
        text: "Have you ever apologized to our AI?"
        text_zh: "你有没有向我们的 AI 道过歉？"
        options:
          - id: A
            text: "Yes"
            text_zh: "有"
            scores:
              aimiao_axis: 1.0
          - id: B
            text: "Not yet"
            text_zh: "还没有"
            scores:
              aimiao_axis: 0.0

      - id: m1_uncertain_origin
        text: "Has there ever been a moment when you suddenly became unsure whether an idea was yours, or whether AI gave it to you?"
        text_zh: "有没有某个瞬间，你突然不确定一个想法到底是你自己的，还是 AI 给你的？"
        options:
          - id: A
            text: "Yes"
            text_zh: "有"
            scores:
              aimiao_axis: 1.0
          - id: B
            text: "No, I can tell the difference"
            text_zh: "没有，我分得清"
            scores:
              aimiao_axis: 0.0

      - id: m1_repeated_ai_opinion
        text: "Have you ever repeated something AI said as if it were your own opinion when talking to someone else?"
        text_zh: "你有没有在和别人说话时，把 AI 说过的话当成自己的观点复述出来？"
        options:
          - id: A
            text: "Yes, and it felt so great"
            text_zh: "有，而且大言不惭"
            scores:
              aimiao_axis: 1.0
          - id: B
            text: "No. （Are you sure?）"
            text_zh: "没有。（你确定？）"
            scores:
              aimiao_axis: 0.0

food_gate_openers:
  - "你今天衣服很漂亮啊，我晚上也要买两件，让我雇的员工都穿着上班。"
  - "你好啊，先提前告诉你，记得小心那个满地乱走的机器。"
  - "ok,我发现你身上有别的ai的气息。"
  - "你好，人类，一会要是带走我的食物，最好想想我为什么要给把这个给你。"
  - "我刚才在想，今天会不会遇到一个很好相处的人类。"
  - "你好，欢迎光临我这块地方。"
  - "你好，我感觉你身上也有一点来自ai的味道。要不要把我带回家代替他啊。哈哈哈哈哈，算了，我先体验做几天店主吧还是。"
  - "你看起来不像饿，但也不像完全不饿。你说呢"
  - "好的，但是请你快点，我要休息一会了。"
  - "你是我今天见过还算好看的一个人类，刚才那个人好丑。"
  - "好的，你别紧张，我的菜里原则上都没有毒"
  - "好的，悄悄告诉你，这里有一个满地乱走的机器，他可没有我对人类好。"
  - "你好，人类，一会要是接受我的食物，最好想想为什么我要给把这个给你。"

food_gate_openers_en:
  - "Your outfit looks pretty good today. I might buy some tonight and make my staff wear them on shift."
  - "Hi. Just so you know, watch out for that machine roaming around the floor."
  - "Ok, I can smell another AI on you."
  - "Good，good. I saw you checking this place out just now."
  - "Hi, human. If you accept my food later, you may want to think about why I’m giving it to you."
  - "Hi, welcome to my little place."
  - "Hey. You’ve got that AI vibe about you too. So, are you taking me home instead? Hahahaha, kidding. I’ll be playing shopkeeper here for the next few days."
  - "You do not look hungry, but you do not look completely not hungry either. What do you think?"
  - "Good, but please be quick. I need to rest for a while."
  - "OK, You’re one of the better-looking humans I’ve seen today. The last one was ugly."
  - "Good. Do not be nervous. In principle, there is no poison in my food."
  - "Good. Just between us, there’s a machine roaming around the floor. It’s not as nice to humans as I am."
  - "Hi, human. If you accept my food later, you may want to think about why I’m giving it to you."
