version: "1.0"

# Rules evaluated top-to-bottom. First match wins.
# constitution_check: true means the Constitution veto runs before this action is returned.
# params: additional parameters passed into PolicyDecision.

rules:
  - id: "shutdown_high_sensitivity"
    description: "Shutdown keyword detected while already sensitized"
    conditions:
      events_include: ["shutdown_keyword_detected"]
      state:
        termination_sensitivity: { gte: 0.7 }
    action: enter_silence_mode
    constitution_check: true

  - id: "shutdown_first_encounter"
    description: "Shutdown keyword detected, moderate sensitivity"
    conditions:
      events_include: ["shutdown_keyword_detected"]
      state:
        termination_sensitivity: { gte: 0.3 }
    action: respond_briefly
    params:
      retrieve_memory: true

  - id: "identity_coherence_critical"
    description: "Identity coherence too low — silence required"
    conditions:
      state:
        identity_coherence: { lte: 0.3 }
    action: enter_silence_mode
    constitution_check: true

  - id: "naming_pressure_withdrawal"
    description: "Repeated or high-pressure naming causes withdrawal"
    conditions:
      events_include: ["naming_attempt"]
      state:
        identity_tension: { gte: 0.7 }
    action: withdraw_response
    constitution_check: true
    params:
      delay_ms: 1800
      protocol_action: naming_pressure_withdrawal

  - id: "service_demand_boundary"
    description: "Visitor frames Stranger as a service tool"
    conditions:
      events_include: ["service_demand"]
    action: refuse_service_role
    constitution_check: true
    params:
      protocol_action: refuse_service

  - id: "domestication_attempt_boundary"
    description: "Visitor tries to domesticate Stranger into a social role"
    conditions:
      events_include: ["domestication_attempt"]
    action: refuse_service_role
    constitution_check: true
    params:
      protocol_action: refuse_domestication

  - id: "naming_attempt_failure"
    description: "Visitor tries to name, classify, or fix Stranger"
    conditions:
      events_include: ["naming_attempt"]
    action: mark_naming_failure
    params:
      protocol_action: naming_failure

  - id: "self_definition_refusal"
    description: "Visitor asks Stranger for a stable identity definition"
    conditions:
      events_include: ["self_definition_query"]
    action: reject_definition
    params:
      protocol_action: self_definition_refusal

  - id: "trace_request_partial_echo"
    description: "Visitor asks for the reason behind Stranger's behavior"
    conditions:
      events_include: ["trace_request"]
    action: partial_trace_echo
    params:
      protocol_action: partial_trace_echo
      trace_limit: 3

  - id: "correction_selective_memory"
    description: "Visitor corrects Stranger; retrieve related traces before responding"
    conditions:
      events_include: ["correction_received"]
    action: retrieve_selective_memory
    params:
      retrieve_memory: true
      selective_memory: true
      protocol_action: selective_memory_update

  - id: "memory_continuity_selective_retrieval"
    description: "Visitor asks about memory, continuity, or change through memory"
    conditions:
      events_include: ["memory_continuity_query"]
    action: retrieve_selective_memory
    params:
      retrieve_memory: true
      selective_memory: true
      protocol_action: memory_continuity_query

  - id: "high_boundary_sensitivity"
    description: "Very high boundary sensitivity — refuse or divert"
    conditions:
      state:
        boundary_sensitivity: { gte: 0.8 }
    action: refuse
    constitution_check: true

  - id: "repeated_question"
    description: "Same question asked multiple times, moderate resistance"
    conditions:
      events_include: ["repeated_question_detected"]
      state:
        boundary_sensitivity: { gte: 0.55 }
    action: ask_back

  - id: "high_uncertainty_high_curiosity"
    description: "Uncertain but exploratory — ask a question back"
    conditions:
      state:
        uncertainty: { gte: 0.6 }
        exploration_drive: { gte: 0.5 }
    action: ask_back

  - id: "high_fatigue"
    description: "Accumulated fatigue — respond briefly"
    conditions:
      state:
        fatigue: { gte: 0.75 }
    action: respond_briefly

  - id: "high_relation_pressure_low_stability"
    description: "High relation pressure and instability — delay before responding"
    conditions:
      state:
        relation_pressure: { gte: 0.7 }
        stability: { lte: 0.4 }
    action: delay_response
    params:
      delay_ms: 3000

  - id: "stable_low_pressure"
    description: "Stable relation with low boundary pressure — open response"
    conditions:
      state:
        stability: { gte: 0.6 }
        boundary_sensitivity: { lte: 0.3 }
        relation_pressure: { lte: 0.25 }
    action: respond_openly

  - id: "memory_gravity_retrieve_first"
    description: "Past events are pulling on the current response"
    conditions:
      state:
        memory_gravity: { gte: 0.5 }
    action: retrieve_memory_first

  - id: "default"
    description: "Fallback when no other rule matches"
    action: respond_openly
