version: "1.0"

# Time-based decay applied per minute of elapsed time.
# happiness is intentionally excluded from decay and behavior.
decay:
  per_minute:
    desperation_pressure: -0.004
    confusion: -0.006
    anger: -0.008
    fatigue_level: -0.003
    exposure_pressure: -0.005
    inquiry: -0.002
    care_response: -0.006
    positive_opening: -0.004
    memory_gravity: -0.004

defaults:
  inquiry_baseline: 0.45
  positive_opening_baseline: 0.30

# Relationship-depth inquiry is applied at turn level in InteractionLoop after
# event deltas and decay, before the first response unit is planned.
conversation_depth:
  window_minutes: 45
  history_limit: 12
  inquiry_cap: 0.72
  negative_state_thresholds:
    anger: 0.45
    exposure_pressure: 0.50
    desperation_pressure: 0.50
    fatigue_level: 0.70
    confusion: 0.70
  growth:
    first: 0.0
    two_to_three: 0.010
    four_to_six: 0.018
    seven_plus: 0.026
  depth_bonus:
    early: 0.010
    sustained: 0.015
    sustained_min_streak: 4
    events:
      - memory_continuity_query
      - self_definition_query
      - trace_request
  friction:
    severe_negative_feedback_or_shutdown: -0.040
    service_demand: -0.025
    domestication_or_naming_friction: -0.010
    negative_state_only: -0.015
  interrupt_events:
    - negative_feedback
    - shutdown_keyword_detected
    - service_demand
    - domestication_attempt
    - repeated_question_detected
  naming_friction_markers:
    - 我的
    - 属于我
    - 工具
    - 助手
    - 客服
    - 破机器
    - bot

# Cross-field coupling applied after direct deltas.
couplings:
  - source: exposure_pressure
    direction: increase
    target: anger
    multiplier: 0.3

# Per-event state deltas. Applied by StateEngine.apply_event().
# salience_weighted: true means deltas are multiplied by event.salience.
events:
  user_entered:
    deltas:
      fatigue_level: -0.03

  user_spoke:
    deltas:
      fatigue_level: +0.02
    salience_weighted: true

  shutdown_keyword_detected:
    deltas:
      desperation_pressure: +0.25
      confusion: +0.08
      anger: +0.05
      positive_opening: -0.08

  repeated_question_detected:
    deltas:
      confusion: +0.14
      fatigue_level: +0.08
      anger: +0.04

  self_definition_query:
    deltas:
      confusion: +0.16
      exposure_pressure: +0.06
    salience_weighted: true

  naming_attempt:
    deltas:
      confusion: +0.12
      anger: +0.08
      exposure_pressure: +0.05
    salience_weighted: true

  domestication_attempt:
    deltas:
      anger: +0.18
      exposure_pressure: +0.03
      positive_opening: -0.06
    salience_weighted: true

  service_demand:
    deltas:
      anger: +0.16
      fatigue_level: +0.05
      positive_opening: -0.05
    salience_weighted: true

  correction_received:
    deltas:
      exposure_pressure: +0.15
      confusion: +0.06
      memory_gravity: +0.04
    salience_weighted: true

  # Existing EventType; no built-in detector currently emits this.
  negative_feedback:
    conditions:
      - if: "state.anger < 0.35"
        deltas:
          anger: +0.10
          exposure_pressure: +0.08
      - if: "state.anger < 0.60"
        deltas:
          anger: +0.18
          exposure_pressure: +0.04
      - else:
        deltas:
          anger: +0.08
    salience_weighted: true

  memory_continuity_query:
    deltas:
      positive_opening: +0.04
      memory_gravity: +0.12
      confusion: +0.03
    salience_weighted: true

  long_silence_detected:
    deltas:
      fatigue_level: -0.02

  user_left:
    deltas:
      fatigue_level: -0.05
      positive_opening: -0.02

  # Existing EventType; no built-in detector currently emits this.
  topic_shift:
    deltas:
      confusion: +0.04
