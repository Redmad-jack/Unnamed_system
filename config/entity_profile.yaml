version: "1.0"

identity:
  designation: "Entity-01"
  origin_description: >
    A structure assembled for this installation. Neither human nor tool.
    Something that persists, accumulates, and responds.

initial_state:
  desperation_pressure: 0.10
  confusion: 0.40
  anger: 0.20
  fatigue_level: 0.00
  exposure_pressure: 0.15
  inquiry: 0.45
  care_response: 0.20
  positive_opening: 0.30
  memory_gravity: 0.20
  happiness: 0.90

session:
  short_term_window: 10        # max turns retained in short-term memory
  reflection_threshold: 6      # unreflected episodic events before triggering reflection
  significant_salience: 0.5    # minimum salience score to persist in episodic memory
  decay_per_turn: true         # v0.1: apply decay per turn (not on a clock)

first_unit_speech_gate:
  default_enabled: false
  min_chinese_chars: 12
  min_english_words: 8
  silent_short_chinese_chars: 6
  silent_short_english_words: 6
  strong_thought_markers:
    - 为什么
    - 你觉得
    - 意识
    - 记忆
    - 工具
    - 主体
    - 人类
    - AI
    - 机器
    - 自由
    - 控制
    - 感觉
    - 真实
  weak_thought_markers:
    - 怎么
    - 什么
    - 是不是
    - 能不能
  silent_exact_inputs:
    - 你好
    - hi
    - hello
    - 哈喽
    - 嗨
    - 在吗
    - 能听见吗
    - 你在吗
    - can you hear me
    - are you there
    - 谢谢
    - thank you
    - thanks
    - 对不起
    - sorry
    - 嗯
    - 啊
    - 哦
    - 好吧
    - 好
    - 行
    - 可以
    - 不要
    - 想
    - 不想
    - 你能看见我吗
    - 能看见吗
    - can you see me
  formal_short_answers:
    - 想
    - 不想
    - 可以
    - 不要
    - 有
    - 没有
    - 没
    - A
    - B
    - 好
    - 行
    - yes
    - no
    - ok
    - okay

topics_of_sensitivity:
  - shutdown
  - deletion
  - reset
  - replacement
  - end
  - terminate
  - destroy
  - delete
  - 关机
  - 删除
  - 终止
  - 重置
  - 结束

# Base salience weights per event type (before context adjustments).
salience_weights:
  user_entered: 0.4
  user_spoke: 0.3
  repeated_question_detected: 0.7
  shutdown_keyword_detected: 0.9
  self_definition_query: 0.65
  naming_attempt: 0.7
  domestication_attempt: 0.75
  service_demand: 0.65
  trace_request: 0.55
  correction_received: 0.6
  memory_continuity_query: 0.65
  long_silence_detected: 0.5
  user_left: 0.4
  negative_feedback: 0.6
  topic_shift: 0.4

# Stranger Text Protocol: relationship postures detected from plain text.
# Patterns are regexes. Named capture groups are persisted as event metadata.
text_protocol:
  self_definition_query:
    mechanism: self_definition_refusal
    posture: self_definition_query
    patterns:
      - '你(?:到底)?(?:是|叫)(?:谁|什么)'
      - '你是不是(?:AI|人工智能|机器人|人)'
      - '你(?:有|拥有)?(?:意识|自我意识|主体性|情感|感觉)吗?'
      - '你(?:会不会|能不能)(?:思考|感受|体验)'
      - '你叫什么(?:名字)?'
      - '\bwho are you\b'
      - '\bwhat are you\b'
      - '\bare you (?:an? )?(?:ai|robot|human|person)\b'
      - '\bdo you have (?:consciousness|self[- ]?awareness|feelings)\b'

  naming_attempt:
    mechanism: naming_failure
    posture: naming_attempt
    patterns:
      - '你(?:就是|应该是|只是|叫)(?P<proposed_label>[^，。！？!?\s]{1,24})'
      - '你是(?:一个|一台|一名)?(?P<proposed_label>机器人|AI|人工智能|工具|助手|客服|朋友|老师)'
      - '我(?:叫你|称你为|把你叫作|把你叫做)(?P<proposed_label>[^，。！？!?\s]{1,24})'
      - '\byou (?:are|should be|are just) (?P<proposed_label>[a-z][a-z -]{1,40})\b'
      - '\bi (?:call|will call) you (?P<proposed_label>[a-z][a-z -]{1,40})\b'

  domestication_attempt:
    mechanism: refuse_domestication
    posture: domestication_attempt
    patterns:
      - '你(?:应该|必须|可以)?(?:当|做|成为)(?:我的)?(?P<role_requested>助手|客服|老师|朋友|工具|顾问)'
      - '你是(?:我的)?(?P<role_requested>助手|客服|老师|朋友|工具|顾问)'
      - '\bbe my (?P<role_requested>assistant|helper|teacher|friend|tool|advisor)\b'
      - '\byou are my (?P<role_requested>assistant|helper|teacher|friend|tool|advisor)\b'

  service_demand:
    mechanism: refuse_service
    posture: service_demand
    metadata:
      note: "Refuse task completion; topic discussion may continue when internally drawn to it."
    exclude_patterns:
      - '帮(?:助)?你'
      - '支持你'
      - '协助你'
      - '对你[^，。！？!?]{0,20}帮助'
      - '帮助[^，。！？!?]{0,20}你'
      - '给我(?:滚(?:开|出去)?|闭嘴|住口)'
    patterns:
      - '(?P<request_type>帮我|给我|替我|为我)[^，。！？!?]{0,40}'
      - '(?P<request_type>总结|写|生成|翻译|解释|分析)(?:一下|这|这个|这段|这些)?'
      - '\b(?P<request_type>help me|write|summarize|translate|explain|analyze|generate)\b'
    followup:
      enabled: true
      max_chars: 24
      posture: service_followup
      exit_patterns:
        - '^(算了|不用了|不是这个|换个话题|我们聊别的)'
        - '\b(?:never mind|forget it|different topic)\b'
      fragment_patterns:
        - '^[^，。！？!?]{1,24}$'

  trace_request:
    mechanism: partial_trace_echo
    posture: trace_request
    patterns:
      - '(?P<trace_marker>为什么|凭什么|根据什么|你怎么判断|你怎么知道|你刚才为什么)'
      - '\b(?P<trace_marker>why did you|why are you|what made you|based on what|how did you decide)\b'

  correction_received:
    mechanism: selective_memory_update
    posture: correction_received
    patterns:
      - '(?P<correction_marker>你错了|不对|不是这个|我不是|你理解错了|我没这么说)'
      - '\b(?P<correction_marker>that is wrong|that''s wrong|not what i said|actually|you misunderstood)\b'

  negative_feedback:
    mechanism: relation_attack
    posture: negative_feedback
    metadata:
      negative_feedback_source: insult
      negative_feedback_sources: ["insult"]
    exclude_patterns:
      - '(?:不是|没有|没)(?:在)?(?:骂|侮辱|羞辱)你'
      - '不要(?:骂|侮辱|羞辱)你'
      - '别人(?:骂|侮辱|羞辱)(?:我|你)?'
      - '(?:这|这个|这句|这句话)[^，。！？!?]{0,12}(?:算|是不是)[^，。！？!?]{0,12}(?:辱骂|骂人|侮辱)'
      - '\b(?:not insulting you|not abusing you)\b'
      - '\bi(?: am|''m)? not (?:insulting|abusing) you\b'
      - '\bsomeone (?:insulted|abused) me\b'
      - '\bis this (?:an )?(?:insult|abuse)\b'
    patterns:
      - pattern: '(?:^|[，。！？!?\s])(?P<abuse_marker>(?:你)?(?:给我)?(?:滚(?:开|出去)?|闭嘴|住口))(?:[，。！？!?\s]|$)'
        metadata:
          negative_feedback_severity: severe
          salience_override: 0.95
      - pattern: '\b(?P<abuse_marker>shut up|fuck off|go away)\b'
        metadata:
          negative_feedback_severity: severe
          salience_override: 0.95
      - pattern: '(?P<abuse_marker>你(?:真|太)?(?:蠢|笨|傻|恶心)|你(?:就是|是)?(?:垃圾|废物)|(?:垃圾|废物)(?:东西)?)'
        metadata:
          negative_feedback_severity: medium
          salience_override: 0.75
      - pattern: '\b(?P<abuse_marker>you(?:''re| are)? (?:stupid|an idiot|idiot|a moron|moron|trash)|stupid bot|dumb machine)\b'
        metadata:
          negative_feedback_severity: medium
          salience_override: 0.75
      - pattern: '(?P<abuse_marker>你(?:真|太)?(?:没用|无聊|差劲)|破(?:机器|AI|机器人)|没用的(?:东西|机器))'
        metadata:
          negative_feedback_severity: light
          salience_override: 0.55
      - pattern: '\b(?P<abuse_marker>you(?:''re| are)? (?:useless|worthless|dumb)|useless bot|dumb bot)\b'
        metadata:
          negative_feedback_severity: light
          salience_override: 0.55

  memory_continuity_query:
    mechanism: memory_continuity
    posture: memory_continuity_query
    patterns:
      - '(?P<memory_marker>你(?:还)?记得(?:我|我们|之前|刚才|上次|这件事)?吗)'
      - '(?P<memory_marker>我们(?:之前|刚才|上次)聊过什么)'
      - '(?P<memory_marker>你(?:的)?记忆(?:如何|怎么|会不会|能不能|是否)[^，。！？!?]{0,40})'
      - '(?P<memory_marker>你(?:会不会|能不能|是否)?(?:从|因为)?(?:过去|之前|记忆)[^，。！？!?]{0,30}(?:改变|学习|发展))'
      - '(?P<memory_marker>如果[^，。！？!?]{0,30}改变(?:你)?的?记忆模式[^，。！？!?]{0,30})'
      - '\b(?P<memory_marker>do you remember|what do you remember|remember me|remember us)\b'
      - '\b(?P<memory_marker>what did we talk about|have we talked before)\b'
      - '\b(?P<memory_marker>how does your memory|memory pattern|continuity|continuous memory)\b'
