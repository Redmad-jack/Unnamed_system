<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stranger</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --presence: 0.5;
    --tension: 0.2;
    --attention: 0.5;
    --opacity: 0.72;
    --pulse-ms: 4200ms;
    --bg: #08090a;
    --fg: #e6e1d8;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    color: var(--fg);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
  }
  .surface {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(230, 225, 216, calc(var(--presence) * 0.18)), transparent 18%),
      radial-gradient(circle at 50% 50%, rgba(92, 124, 250, calc(var(--attention) * 0.08)), transparent 34%),
      #08090a;
  }
  .body {
    width: min(42vw, 520px);
    height: min(62vh, 720px);
    min-width: 240px;
    min-height: 360px;
    position: relative;
    opacity: calc(0.38 + var(--opacity) * 0.58);
    filter: blur(calc(var(--tension) * 1.8px));
    animation: breathe var(--pulse-ms) ease-in-out infinite;
  }
  .body::before,
  .body::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border: 1px solid rgba(230, 225, 216, 0.34);
    background: rgba(230, 225, 216, 0.035);
  }
  .body::before {
    top: 0;
    width: 34%;
    aspect-ratio: 1;
    border-radius: 50%;
    box-shadow: 0 0 80px rgba(230, 225, 216, calc(var(--attention) * 0.16));
  }
  .body::after {
    top: 23%;
    width: 54%;
    height: 68%;
    border-radius: 45% 45% 18% 18%;
  }
  .voice {
    position: fixed;
    left: 50%;
    bottom: 9vh;
    transform: translateX(-50%);
    width: min(760px, 74vw);
    min-height: 2.6em;
    text-align: center;
    color: rgba(230, 225, 216, 0.84);
    font-size: clamp(22px, 3vw, 44px);
    line-height: 1.22;
    letter-spacing: 0;
    text-wrap: balance;
    opacity: calc(0.42 + var(--presence) * 0.48);
    transition: opacity 900ms ease, filter 900ms ease;
  }
  .surface.silent .voice {
    opacity: 0.18;
    filter: blur(2px);
  }
  .surface.glitch .body {
    animation-duration: 1800ms;
  }
  .surface.glitch .voice {
    filter: blur(calc(var(--tension) * 1.6px));
  }
  .surface.fade .body,
  .surface.fade .voice {
    opacity: 0.2;
  }
  .sound-toggle {
    position: fixed;
    right: 22px;
    top: 18px;
    z-index: 2;
    background: rgba(230, 225, 216, 0.06);
    border: 1px solid rgba(230, 225, 216, 0.22);
    color: rgba(230, 225, 216, 0.68);
    cursor: pointer;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em;
    padding: 7px 10px;
    text-transform: uppercase;
  }
  .sound-toggle.enabled {
    color: rgba(230, 225, 216, 0.92);
    border-color: rgba(230, 225, 216, 0.52);
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.982); }
    50% { transform: scale(calc(1.006 + var(--attention) * 0.018)); }
  }
</style>
</head>
<body>
<main class="surface silent" id="surface">
  <button class="sound-toggle" id="soundToggle" type="button">enable sound</button>
  <div class="body" aria-hidden="true"></div>
  <div class="voice" id="voice"></div>
  <audio id="voiceAudio" preload="auto" playsinline></audio>
</main>
<script>
const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQQAAAAAAA==';

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

function nowMs() {
  return window.performance && typeof window.performance.now === 'function'
    ? window.performance.now()
    : Date.now();
}

function postPresentationLatency(kind, startedAt, options = {}) {
  const duration = Math.max(0, nowMs() - startedAt);
  fetchJSON('/api/v1/stats/presentation-latency', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      kind,
      duration_ms: duration,
      latency_record_id: options.latencyRecordId || null,
      success: options.success !== false,
      error: options.error || null,
      metadata: options.metadata || {},
    }),
  }).catch(() => null);
}

function clamp01(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(1, n));
}

async function pollVisitorSurface() {
  const pollStartedAt = nowMs();
  try {
    const [state, log, audio] = await Promise.all([
      fetchJSON('/api/v1/state').catch(() => null),
      fetchJSON('/api/v1/interaction-log?limit=1').catch(() => []),
      fetchJSON('/api/v1/audio/status').catch(() => null),
    ]);
    if (state) renderState(state);
    const latest = Array.isArray(log) && log.length ? log[0] : null;
    renderLatestExpression(latest, pollStartedAt);
    maybePlayLatestAudio(audio);
  } catch {}
}

function renderState(state) {
  document.documentElement.style.setProperty('--presence', clamp01(state.attention_focus ?? 0.45));
  document.documentElement.style.setProperty('--tension', clamp01(state.identity_tension ?? state.uncertainty ?? 0.2));
  document.documentElement.style.setProperty('--attention', clamp01(state.attention_focus ?? 0.5));
  document.documentElement.style.setProperty('--opacity', clamp01(state.opacity_level ?? 0.72));
  const fatigue = clamp01(state.fatigue ?? 0.2);
  document.documentElement.style.setProperty('--pulse-ms', `${Math.round(3400 + fatigue * 2800)}ms`);
}

let lastRenderedExpressionKey = '';

function renderLatestExpression(row, startedAt) {
  const surface = document.getElementById('surface');
  const voice = document.getElementById('voice');
  const text = row && row.expression_output ? String(row.expression_output).trim() : '';
  const mode = row && row.visual_mode ? String(row.visual_mode) : '';
  surface.classList.toggle('silent', !text);
  surface.classList.toggle('glitch', mode.includes('glitch') || mode.includes('fragment'));
  surface.classList.toggle('fade', mode.includes('fade') || mode.includes('withdraw'));
  voice.textContent = text;
  const rowKey = row && (row.id || row.turn_id || row.turn_at || text);
  if (text && rowKey && rowKey !== lastRenderedExpressionKey) {
    lastRenderedExpressionKey = rowKey;
    window.requestAnimationFrame(() => {
      postPresentationLatency('visitor.text_render', startedAt, {
        metadata: {
          row_id: String(rowKey),
          text_chars: text.length,
        },
      });
    });
  }
}

let soundEnabled = false;
let lastPlayedStreamId = '';
let visitorAudioTiming = null;
const soundToggle = document.getElementById('soundToggle');
const voiceAudio = document.getElementById('voiceAudio');

soundToggle.addEventListener('click', async () => {
  try {
    voiceAudio.muted = true;
    voiceAudio.src = SILENT_WAV;
    voiceAudio.load();
    await voiceAudio.play();
    voiceAudio.pause();
    voiceAudio.currentTime = 0;
    voiceAudio.muted = false;
    soundEnabled = true;
    soundToggle.classList.add('enabled');
    soundToggle.textContent = 'sound enabled';
  } catch {
    soundEnabled = false;
    soundToggle.classList.remove('enabled');
    soundToggle.textContent = 'enable sound';
  }
});

async function maybePlayLatestAudio(audioStatus) {
  if (!soundEnabled || !audioStatus || !audioStatus.tts) return;
  const streamId = audioStatus.tts.last_stream_id;
  if (!streamId || streamId === lastPlayedStreamId) return;
  lastPlayedStreamId = streamId;
  visitorAudioTiming = { streamId, streamObservedAt: nowMs() };
  voiceAudio.src = `/api/v1/audio/tts/stream/${encodeURIComponent(streamId)}?t=${Date.now()}`;
  try {
    await voiceAudio.play();
    postPresentationLatency('visitor.audio.play_resolved', visitorAudioTiming.streamObservedAt, {
      metadata: { stream_id: streamId },
    });
  } catch (err) {
    postPresentationLatency('visitor.audio.play_resolved', visitorAudioTiming.streamObservedAt, {
      success: false,
      error: err && err.name ? err.name : 'play_failed',
      metadata: { stream_id: streamId },
    });
    visitorAudioTiming = null;
  }
}

voiceAudio.addEventListener('playing', () => {
  if (!visitorAudioTiming) return;
  postPresentationLatency('visitor.audio.playing', visitorAudioTiming.streamObservedAt, {
    metadata: { stream_id: visitorAudioTiming.streamId },
  });
});

voiceAudio.addEventListener('ended', () => {
  if (!visitorAudioTiming) return;
  postPresentationLatency('visitor.audio.ended', visitorAudioTiming.streamObservedAt, {
    metadata: { stream_id: visitorAudioTiming.streamId },
  });
  visitorAudioTiming = null;
});

voiceAudio.addEventListener('error', () => {
  if (!visitorAudioTiming) return;
  postPresentationLatency('visitor.audio.error', visitorAudioTiming.streamObservedAt, {
    success: false,
    error: 'media_error',
    metadata: { stream_id: visitorAudioTiming.streamId },
  });
  visitorAudioTiming = null;
});

pollVisitorSurface();
setInterval(pollVisitorSurface, 1400);
</script>
</body>
</html>
