<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Have Some Ai Particle Surface</title>
<link rel="stylesheet" href="/particle-display-assets/particle-display.css">
</head>
<body>
<main id="particleSurface" class="particle-shell webgl-loading" aria-label="Have Some Ai particle surface">
  <div class="ambient-field" aria-hidden="true">
    <div class="fallback-halo"></div>
    <div class="fallback-halo fallback-halo-wide"></div>
    <div class="fallback-orb"></div>
    <div class="fallback-ring"></div>
    <div class="fallback-ring"></div>
    <div class="fallback-noise"></div>
  </div>
  <div id="particleCanvasHost" class="particle-canvas-host" aria-hidden="true"></div>
  <section class="particle-text-plane" aria-live="polite">
    <article id="particleCue" class="particle-cue" hidden>
      <p id="particleResultLine" class="particle-result-line"></p>
      <div class="particle-main-row">
        <h1 id="particleMainLine" class="particle-main-line"></h1>
        <button id="particleWakeButton" class="particle-wake-button" type="button" aria-label="Press the button to wake me" hidden>
          <span class="wake-particle-field" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span class="wake-orbit-field" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
      <div id="particleOptionsLine" class="particle-options-line"></div>
      <p id="particleSubLine" class="particle-sub-line"></p>
    </article>
  </section>
</main>
<script src="/particle-display-assets/particle-display.js"></script>
</body>
</html>
