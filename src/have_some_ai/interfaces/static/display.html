<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Have Some "Ai" Display</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg-a: #d9e3dc;
    --bg-b: #becdc4;
    --bg-c: #edf2ee;
    --ink: #19231e;
    --muted: #4e5b54;
    --thin: rgba(244, 249, 246, 0.62);
    --deep: rgba(46, 66, 58, 0.34);
    --mist: rgba(212, 226, 216, 0.58);
    --glow: rgba(233, 246, 237, 0.72);
    --shade: rgba(23, 37, 31, 0.24);
    --film-tint-rgb: 204, 225, 212;
    --film-opacity: 0.44;
    --film-blur: 7px;
    --film-saturate: 0.72;
    --film-noise-opacity: 0.16;
    --film-highlight-opacity: 0.24;
    --film-edge-opacity: 0.2;
    --film-texture-opacity: 0.4;
    --film-texture-overlay-opacity: 0.1;
    --film-texture-scale: 1.015;
    --avatar-gray-a: rgba(6, 6, 6, 0.98);
    --avatar-gray-b: rgba(20, 21, 21, 0.9);
    --avatar-gray-shadow: rgba(0, 0, 0, 0.58);
    --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  @property --silhouette-opacity {
    syntax: "<number>";
    inherits: true;
    initial-value: 0.3;
  }

  @property --silhouette-blur {
    syntax: "<length>";
    inherits: true;
    initial-value: 34px;
  }

  @property --silhouette-scale {
    syntax: "<number>";
    inherits: true;
    initial-value: 0.98;
  }

  @property --silhouette-y {
    syntax: "<percentage>";
    inherits: true;
    initial-value: -50%;
  }

  @property --stress-opacity {
    syntax: "<number>";
    inherits: true;
    initial-value: 0.12;
  }

  @property --stress-scale {
    syntax: "<number>";
    inherits: true;
    initial-value: 0.92;
  }

  @property --stress-y {
    syntax: "<percentage>";
    inherits: true;
    initial-value: -50%;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 16%, rgba(242, 248, 243, 0.88), transparent 34%),
      radial-gradient(ellipse at 22% 72%, rgba(184, 204, 191, 0.46), transparent 40%),
      linear-gradient(145deg, var(--bg-c) 0%, var(--bg-a) 34%, var(--bg-b) 100%);
    color: var(--ink);
    font-family: var(--font);
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 100svh;
    isolation: isolate;
    overflow: hidden;
  }

  .silhouette-stage {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    contain: layout paint;
    --presence-breath-duration: 9s;
    --presence-breath-lift: -1%;
    --presence-breath-min: 0.98;
    --presence-breath-max: 1.01;
    --torso-breath-x: 1;
    --torso-breath-y: 1;
    --torso-breath-lift: 0%;
    --head-breath-x: 0%;
    --head-breath-lift: 0%;
    --avatar-head-rotation: 180deg;
    --mouth-open: 0;
    --mouth-opacity: 0;
    --mouth-shadow-opacity: 0.16;
    --mouth-shift-x: 0%;
    --mouth-width-scale: 1;
    --film-press: 0;
    --left-dent-pressure: 0;
    --right-dent-pressure: 0;
    --film-tremble-x: 0px;
    --film-tremble-y: 0px;
    --texture-tremble-x: 0px;
    --texture-tremble-y: 0px;
    --left-dent-x: 43%;
    --left-dent-y: 54%;
    --right-dent-x: 57%;
    --right-dent-y: 54%;
    transition:
      --silhouette-opacity 320ms ease,
      --silhouette-blur 320ms ease,
      --silhouette-scale 320ms ease,
      --silhouette-y 320ms ease,
      --stress-opacity 260ms ease,
      --stress-scale 260ms ease,
      --stress-y 260ms ease;
  }

  .silhouette-stage[data-state="idle_breathing"] {
    --silhouette-opacity: 0.78;
    --silhouette-blur: 11px;
    --silhouette-scale: 0.98;
    --silhouette-y: -50%;
    --presence-breath-duration: 9.8s;
    --presence-breath-lift: -0.42%;
    --presence-breath-min: 0.998;
    --presence-breath-max: 1.004;
    --torso-breath-x: 1.018;
    --torso-breath-y: 1.012;
    --torso-breath-lift: -0.16%;
    --head-breath-x: 0.14%;
    --head-breath-lift: -0.34%;
    --stress-opacity: 0.12;
    --stress-scale: 0.92;
    --stress-y: -50%;
  }

  .silhouette-stage[data-state="greeting_wave"] {
    --silhouette-opacity: 0.96;
    --silhouette-blur: 7px;
    --silhouette-scale: 1.06;
    --silhouette-y: -52%;
    --stress-opacity: 0.18;
    --stress-scale: 0.98;
    --stress-y: -51%;
  }

  .silhouette-stage[data-state="system_speaking"] {
    --silhouette-opacity: 0.94;
    --silhouette-blur: 7px;
    --silhouette-scale: 1.08;
    --silhouette-y: -52%;
    --stress-opacity: 0.5;
    --stress-scale: 1.08;
    --stress-y: -53%;
    --left-dent-x: 42%;
    --left-dent-y: 54%;
    --right-dent-x: 58%;
    --right-dent-y: 54%;
  }

  .silhouette-stage[data-state="audience_speaking"] {
    --silhouette-opacity: 0.78;
    --silhouette-blur: 12px;
    --silhouette-scale: 0.98;
    --silhouette-y: -50%;
    --presence-breath-duration: 10.8s;
    --presence-breath-lift: -0.24%;
    --presence-breath-min: 0.999;
    --presence-breath-max: 1.002;
    --torso-breath-x: 1.009;
    --torso-breath-y: 1.006;
    --torso-breath-lift: -0.08%;
    --head-breath-x: 0.06%;
    --head-breath-lift: -0.18%;
    --stress-opacity: 0.1;
    --stress-scale: 0.92;
    --stress-y: -50%;
  }

  .silhouette-layer {
    position: absolute;
    inset: 0;
  }

  .silhouette-glow {
    background:
      radial-gradient(circle at 48% 42%, rgba(255, 255, 255, 0.34), transparent 26%),
      radial-gradient(circle at 54% 46%, rgba(74, 95, 84, 0.12), transparent 42%);
    filter: blur(12px);
    opacity: 0.72;
    z-index: 0;
  }

  .silhouette-body {
    z-index: 1;
  }

  .membrane-main {
    overflow: hidden;
    background:
      radial-gradient(ellipse at 49% 40%, rgba(247, 253, 248, 0.38), transparent 34%),
      radial-gradient(ellipse at 50% 58%, rgba(105, 129, 116, 0.1), transparent 58%),
      linear-gradient(90deg, rgba(255, 255, 255, 0.16), transparent 19%, rgba(255, 255, 255, 0.08) 72%, transparent),
      linear-gradient(180deg, rgba(var(--film-tint-rgb), 0.78), rgba(188, 207, 195, var(--film-opacity)));
    background-color: rgba(var(--film-tint-rgb), var(--film-opacity));
    -webkit-backdrop-filter: blur(var(--film-blur)) saturate(var(--film-saturate)) contrast(0.92);
    backdrop-filter: blur(var(--film-blur)) saturate(var(--film-saturate)) contrast(0.92);
    box-shadow:
      inset 0 0 86px rgba(255, 255, 255, 0.2),
      inset 0 22px 90px rgba(250, 255, 251, 0.18),
      inset 0 -95px 170px rgba(31, 48, 40, 0.18),
      inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    z-index: 2;
  }

  .membrane-texture {
    background-image: url("/display-assets/avatar-film-texture.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: var(--film-texture-opacity);
    mix-blend-mode: normal;
    filter: saturate(0.58) contrast(0.94) brightness(1.05);
    transform:
      translate3d(var(--texture-tremble-x), var(--texture-tremble-y), 0)
      scale(var(--film-texture-scale));
    transition: opacity 260ms ease, transform 160ms ease-out;
    z-index: 6;
  }

  .membrane-texture-overlay {
    background-image: url("/display-assets/avatar-film-overlay.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: var(--film-texture-overlay-opacity);
    mix-blend-mode: normal;
    filter: saturate(0.72) contrast(0.96) brightness(1.04);
    transform:
      translate3d(var(--texture-tremble-x), var(--texture-tremble-y), 0)
      scale(var(--film-texture-scale));
    transition: opacity 260ms ease, transform 160ms ease-out;
    z-index: 7;
  }

  .membrane-main::before,
  .membrane-main::after,
  .membrane-surface::before,
  .membrane-surface::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .membrane-main::before {
    background:
      radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, 0.16), transparent 30%),
      radial-gradient(ellipse at 54% 54%, rgba(45, 66, 56, 0.08), transparent 48%);
    opacity: var(--film-highlight-opacity);
  }

  .membrane-main::after {
    background:
      linear-gradient(90deg, rgba(33, 51, 43, 0.1), transparent 8%, transparent 92%, rgba(248, 255, 250, 0.16)),
      linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 16%, transparent 82%, rgba(38, 56, 48, 0.1));
    opacity: var(--film-edge-opacity);
  }

  .membrane-surface {
    background:
      radial-gradient(ellipse at 50% 43%, transparent 0 30%, rgba(33, 52, 43, 0.075) 55%, transparent 76%),
      linear-gradient(104deg, transparent 0 38%, rgba(255, 255, 255, 0.13) 47%, transparent 58%),
      repeating-linear-gradient(112deg, rgba(255, 255, 255, 0.055) 0 1px, transparent 1px 19px);
    mix-blend-mode: soft-light;
    opacity: 0.56;
    z-index: 4;
  }

  .membrane-surface::before {
    background:
      repeating-radial-gradient(circle at 12% 24%, rgba(255, 255, 255, 0.22) 0 0.7px, transparent 0.8px 3.8px),
      repeating-radial-gradient(circle at 78% 66%, rgba(34, 51, 43, 0.12) 0 0.6px, transparent 0.7px 4.6px);
    opacity: var(--film-noise-opacity);
  }

  .membrane-surface::after {
    background:
      radial-gradient(ellipse at 50% 41%, transparent 0 28%, rgba(255, 255, 255, 0.1) 43%, transparent 62%),
      radial-gradient(ellipse at 49% 39%, rgba(255, 255, 255, 0.18), transparent 24%),
      linear-gradient(88deg, rgba(255, 255, 255, 0.1), transparent 18%, transparent 82%, rgba(36, 55, 46, 0.09));
    opacity: var(--film-highlight-opacity);
  }

  .membrane-stress {
    left: 50%;
    top: 41%;
    width: min(56vw, 760px);
    height: min(58vh, 620px);
    overflow: visible;
    transform:
      translate(
        calc(-50% + var(--film-tremble-x)),
        calc(var(--stress-y) + var(--film-tremble-y))
      )
      scale(var(--stress-scale));
    border-radius: 48% 52% 46% 44%;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(247, 255, 249, 0.32), rgba(205, 225, 213, 0.12) 36%, transparent 68%),
      linear-gradient(108deg, transparent 0 46%, rgba(31, 50, 42, 0.1) 47%, rgba(255, 255, 255, 0.12) 48%, transparent 51% 100%);
    filter: blur(12px);
    opacity: calc(var(--stress-opacity) + var(--film-press) * 0.08);
    transition: opacity 260ms ease, transform 260ms ease-out;
    z-index: 5;
  }

  .membrane-dent,
  .membrane-strain-lines {
    position: absolute;
    pointer-events: none;
    opacity: 0;
  }

  .membrane-dent {
    width: clamp(92px, 12vw, 172px);
    aspect-ratio: 1.45;
    border-radius: 999px;
    background:
      radial-gradient(ellipse at 46% 36%, rgba(255, 255, 255, 0.46), rgba(241, 252, 245, 0.18) 34%, transparent 68%),
      radial-gradient(ellipse at 56% 64%, rgba(21, 38, 31, 0.18), transparent 62%),
      linear-gradient(103deg, transparent 0 38%, rgba(255, 255, 255, 0.22) 48%, transparent 62% 100%);
    box-shadow:
      inset 0 0 26px rgba(255, 255, 255, 0.16),
      inset 0 -18px 42px rgba(28, 48, 38, 0.12),
      0 0 34px rgba(237, 250, 241, 0.16);
    filter: blur(5px);
    mix-blend-mode: soft-light;
    transition: opacity 140ms ease-out, transform 140ms ease-out, filter 140ms ease-out;
    z-index: 1;
  }

  .membrane-dent-left {
    --dent-pressure: var(--left-dent-pressure);
    left: var(--left-dent-x);
    top: var(--left-dent-y);
    opacity: calc(var(--dent-pressure) * 0.56);
    transform:
      translate(-50%, -50%)
      rotate(-8deg)
      scaleX(calc(0.84 + var(--dent-pressure) * 0.22))
      scaleY(calc(0.68 + var(--dent-pressure) * 0.26));
  }

  .membrane-dent-right {
    --dent-pressure: var(--right-dent-pressure);
    left: var(--right-dent-x);
    top: var(--right-dent-y);
    opacity: calc(var(--dent-pressure) * 0.56);
    transform:
      translate(-50%, -50%)
      rotate(8deg)
      scaleX(calc(0.84 + var(--dent-pressure) * 0.22))
      scaleY(calc(0.68 + var(--dent-pressure) * 0.26));
  }

  .membrane-strain-lines {
    width: clamp(116px, 16vw, 242px);
    height: clamp(74px, 9vw, 132px);
    background:
      repeating-linear-gradient(
        99deg,
        transparent 0 14px,
        rgba(255, 255, 255, 0.2) 14px 15px,
        rgba(42, 61, 52, 0.08) 16px 17px,
        transparent 17px 32px
      );
    filter: blur(1.2px);
    mix-blend-mode: soft-light;
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 0 56%, transparent 76%);
    mask-image: radial-gradient(ellipse at 50% 50%, black 0 56%, transparent 76%);
    transition: opacity 150ms ease-out, transform 150ms ease-out;
    z-index: 2;
  }

  .membrane-strain-lines-left {
    --line-pressure: var(--left-dent-pressure);
    left: var(--left-dent-x);
    top: var(--left-dent-y);
    opacity: calc(var(--line-pressure) * 0.28);
    transform:
      translate(-50%, -50%)
      rotate(-13deg)
      scaleX(calc(0.86 + var(--line-pressure) * 0.2));
  }

  .membrane-strain-lines-right {
    --line-pressure: var(--right-dent-pressure);
    left: var(--right-dent-x);
    top: var(--right-dent-y);
    opacity: calc(var(--line-pressure) * 0.28);
    transform:
      translate(-50%, -50%)
      rotate(13deg)
      scaleX(calc(0.86 + var(--line-pressure) * 0.2));
  }

  .presence {
    position: absolute;
    left: 50%;
    top: 46%;
    width: min(45vw, 620px);
    height: min(64vh, 680px);
    transform: translate3d(-50%, var(--silhouette-y), 0) scale(var(--silhouette-scale));
    opacity: var(--silhouette-opacity);
    filter: blur(var(--silhouette-blur)) saturate(0) contrast(1.08);
    animation: avatar-presence-breathe var(--presence-breath-duration) ease-in-out infinite;
    transition: opacity 320ms ease, filter 320ms ease, transform 320ms ease;
    will-change: transform, opacity;
    contain: layout paint;
    z-index: 1;
  }

  .avatar-part {
    position: absolute;
    background:
      linear-gradient(180deg, var(--avatar-gray-a), var(--avatar-gray-b));
    box-shadow:
      0 0 22px rgba(245, 248, 247, 0.18),
      0 0 64px var(--avatar-gray-shadow),
      inset 0 0 56px rgba(245, 247, 246, 0.08);
    transition:
      top 320ms cubic-bezier(0.22, 0.8, 0.22, 1),
      left 320ms cubic-bezier(0.22, 0.8, 0.22, 1),
      right 320ms cubic-bezier(0.22, 0.8, 0.22, 1),
      transform 320ms cubic-bezier(0.22, 0.8, 0.22, 1),
      opacity 220ms ease;
  }

  .avatar-head {
    left: 37.8%;
    top: 5%;
    width: 24.4%;
    height: 13.4%;
    border-radius: 46% 46% 42% 42%;
    transform-origin: 50% 76%;
    transform: translate3d(0, 0, 0) rotate(var(--avatar-head-rotation));
    opacity: 0.98;
    z-index: 3;
  }

  .avatar-torso {
    left: 38%;
    top: 24%;
    width: 24%;
    height: 50%;
    border-radius: 38% 38% 34% 34%;
    transform-origin: 50% 18%;
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 0.96;
    z-index: 2;
  }

  .avatar-leg {
    top: 72%;
    width: 8%;
    height: 72%;
    border-radius: 999px 999px 42% 42%;
    transform-origin: 50% 8%;
    opacity: 0.82;
    z-index: 2;
  }

  .avatar-left-leg {
    left: 39.5%;
    transform: rotate(3deg);
  }

  .avatar-right-leg {
    right: 39.5%;
    transform: rotate(-3deg);
  }

  .avatar-upper-arm,
  .avatar-forearm {
    width: 7.7%;
    border-radius: 999px;
    opacity: 0.84;
  }

  .avatar-upper-arm {
    top: 29%;
    height: 30%;
    transform-origin: 50% 8%;
    z-index: 1;
  }

  .avatar-forearm {
    top: 54%;
    height: 28%;
    transform-origin: 50% 10%;
    z-index: 2;
  }

  .avatar-hand {
    top: 80%;
    width: 8.7%;
    height: 6%;
    border-radius: 48% 52% 44% 48%;
    transform-origin: 50% 16%;
    opacity: 0.9;
    z-index: 3;
  }

  .avatar-left-upper-arm {
    left: 32%;
    transform: rotate(16deg);
  }

  .avatar-left-forearm {
    left: 28%;
    transform: rotate(4deg);
  }

  .avatar-left-hand {
    left: 25%;
    transform: rotate(-5deg);
  }

  .avatar-right-upper-arm {
    right: 32%;
    transform: rotate(-16deg);
  }

  .avatar-right-forearm {
    right: 28%;
    transform: rotate(-4deg);
  }

  .avatar-right-hand {
    right: 25%;
    transform: rotate(5deg);
  }

  .avatar-mouth-shadow,
  .avatar-mouth-opening {
    left: 45.3%;
    top: 16.5%;
    width: 9.4%;
    height: 2.2%;
    border-radius: 999px;
    transform-origin: 50% 50%;
  }

  .avatar-mouth-shadow {
    background: rgba(17, 29, 24, 0.3);
    box-shadow: 0 0 18px rgba(14, 28, 22, 0.16);
    opacity: var(--mouth-shadow-opacity);
    transform:
      translate3d(var(--mouth-shift-x), 0, 0)
      scaleX(var(--mouth-width-scale))
      scaleY(calc(0.42 + var(--mouth-open) * 0.88));
    transition: opacity 90ms ease, transform 90ms ease;
    z-index: 4;
  }

  .avatar-mouth-opening {
    background: rgba(9, 18, 15, 0.48);
    box-shadow: 0 0 24px rgba(6, 18, 14, 0.18);
    opacity: var(--mouth-opacity);
    transform:
      translate3d(var(--mouth-shift-x), 0, 0)
      scaleX(var(--mouth-width-scale))
      scaleY(calc(0.38 + var(--mouth-open) * 2.18));
    transition: opacity 80ms ease, transform 80ms ease;
    z-index: 5;
  }

  .text-plane {
    position: absolute;
    left: 50%;
    bottom: clamp(54px, 8.2vh, 108px);
    width: min(900px, calc(100vw - 56px));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: left;
    z-index: 8;
    pointer-events: none;
  }

  .prompt-cue-card {
    --cue-decoration-size: clamp(79px, 10.8vw, 151px);
    position: relative;
    width: min(820px, 100%);
    height: clamp(119px, 12.8vh, 165px);
    padding:
      clamp(22px, 2.8vw, 34px)
      clamp(25px, 3.7vw, 49px)
      clamp(22px, 3vw, 38px)
      clamp(92px, 14.4vw, 169px);
    overflow: visible;
    border: 1px solid rgba(244, 250, 247, 0.48);
    border-radius: clamp(25px, 3.1vw, 43px);
    background:
      linear-gradient(135deg, rgba(248, 252, 249, 0.18), rgba(225, 236, 229, 0.04)),
      rgba(239, 246, 241, 0.7);
    -webkit-backdrop-filter: blur(22px) saturate(0.88) contrast(0.98);
    backdrop-filter: blur(22px) saturate(0.88) contrast(0.98);
    box-shadow:
      0 24px 72px rgba(27, 42, 35, 0.16),
      inset 0 1px 0 rgba(255, 255, 255, 0.52),
      inset 0 -1px 0 rgba(76, 98, 87, 0.08);
    opacity: 0;
    transform: translate3d(0, 14px, 0);
  }

  .prompt-cue-card[hidden] {
    display: none;
  }

  .prompt-cue-card.is-visible {
    animation: prompt-cue-card-enter 460ms cubic-bezier(0.22, 0.8, 0.22, 1) both;
  }

  .prompt-cue-card__body {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    min-height: 0;
  }

  .prompt-cue-card__decoration {
    position: absolute;
    left: clamp(-36px, -2.5vw, -18px);
    top: clamp(-42px, -3.2vw, -18px);
    z-index: 1;
    width: var(--cue-decoration-size);
    height: var(--cue-decoration-size);
    pointer-events: none;
    opacity: 0.86;
  }

  .prompt-cue-card__decoration::before {
    content: "";
    position: absolute;
    inset: 18%;
    border-radius: 999px;
    background:
      radial-gradient(circle, rgba(245, 255, 248, 0.5), transparent 62%),
      radial-gradient(circle at 38% 42%, rgba(93, 139, 124, 0.12), transparent 68%);
    filter: blur(16px);
    transform: translate3d(4%, 5%, 0);
  }

  .prompt-cue-card__decoration img {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: rotate(-6deg);
    mix-blend-mode: multiply;
    filter:
      drop-shadow(1.2px 0 rgba(216, 76, 102, 0.18))
      drop-shadow(-1.2px 0 rgba(54, 132, 145, 0.16))
      drop-shadow(0 18px 28px rgba(33, 49, 42, 0.12))
      saturate(0.9)
      contrast(1.03);
  }

  .prompt-cue-card[data-decoration-variant="left-edge"] {
    padding-left: clamp(108px, 15.3vw, 185px);
  }

  .prompt-cue-card[data-decoration-variant="left-edge"] .prompt-cue-card__decoration {

  decoration: promptCueDecoration,
  showDecoration: true,
  decorationSrc: '/display-assets/amhand.png',
  decorationVariant: 'corner',
});

function cleanText(value) {
  return typeof value === 'string' ? value.trim() : '';
}

function PromptCueCard({
  root,
  mainLine,
  resultLine,
  optionsLine,
  subLine,
  decoration,
  showDecoration = true,
  decorationSrc = '/display-assets/amhand.png',
  decorationVariant = 'corner',
} = {}) {
  let lastSignature = '';

  root.dataset.decorationVariant = decorationVariant || 'corner';
  root.classList.toggle('is-decoration-hidden', showDecoration !== true);
  if (decoration) {
    decoration.src = decorationSrc;
    decoration.addEventListener('error', () => {
      root.classList.add('is-decoration-hidden');
    }, { once: true });
  }

  function splitText(value, mode) {
    const text = cleanText(value);
    if (!text) return { prompt: '', options: [] };
    const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
    if (mode !== 'question' || lines.length < 2) {
      return { prompt: text, options: [] };
    }
    return {
      prompt: lines[0],
      options: lines.slice(1),
    };
  }

  function setMainText(value) {
    const text = cleanText(value);
    mainLine.textContent = text;
    mainLine.classList.toggle('is-long', text.length > 42);
    mainLine.classList.toggle('is-very-long', text.length > 82);
  }

  function setOptions(items) {
    optionsLine.replaceChildren();
    optionsLine.hidden = items.length === 0;
    for (const item of items) {
      const line = document.createElement('p');
      line.className = 'option-line';
      line.textContent = item;
      optionsLine.appendChild(line);
    }
  }

  function enter(signature) {
    if (signature === lastSignature) return;
    lastSignature = signature;
    root.hidden = false;
    root.classList.remove('is-visible');
    void root.offsetWidth;
    root.classList.add('is-visible');
  }

  function hide() {
    lastSignature = '';
    setMainText('');
    setOptions([]);
    resultLine.textContent = '';
    subLine.textContent = '';
    root.classList.remove('is-visible');
    root.hidden = true;
  }

  function render({
    mode = 'idle',
    displayText = '',
    foodName = '',
    foodSubtitle = '',
  } = {}) {
    const normalizedMode = cleanText(mode) || 'idle';
    root.dataset.mode = normalizedMode;

    resultLine.textContent = '';
    subLine.textContent = '';
    setOptions([]);

    if (normalizedMode === 'result') {
      const resultText = cleanText(displayText);
      const title = cleanText(foodName) || resultText;
      if (!title && !resultText) {
        hide();
        return;
      }
      resultLine.textContent = resultText;
      setMainText(title);
      subLine.textContent = cleanText(foodSubtitle);
      enter([normalizedMode, resultText, title, cleanText(foodSubtitle)].join('|'));
      return;
    }

    const text = cleanText(displayText);
    if (!text) {
      hide();
      return;
    }
    const cue = splitText(text, normalizedMode);
    setMainText(cue.prompt);
    setOptions(cue.options);
    enter([normalizedMode, cue.prompt, cue.options.join('|')].join('|'));
  }

  return { render };
}

function classForMode(mode) {
  if (mode === 'robot_speaking') return 'state-robot-speaking';
  if (mode === 'question') return 'state-question';
  if (mode === 'result') return 'state-result';
  if (mode === 'error') return 'state-error';
  return 'state-idle';
}

function createSilhouetteStage(root) {
  const classByState = Object.freeze({
    [AVATAR_STATES.IDLE_BREATHING]: 'avatar-state-idle-breathing',
    [AVATAR_STATES.GREETING_WAVE]: 'avatar-state-greeting-wave',
    [AVATAR_STATES.SYSTEM_SPEAKING]: 'avatar-state-system-speaking',
    [AVATAR_STATES.AUDIENCE_SPEAKING]: 'avatar-state-audience-speaking',
  });
  const classes = Object.values(classByState);
  let currentState = null;
  let mouthTimer = null;
  let mouthTick = 0;
  let pressureTimer = null;
  let pressureReleaseTimer = null;
  let pressureRunning = false;
  const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)');

  function setClosedMouth() {
    root.style.setProperty('--mouth-open', '0');
    root.style.setProperty('--mouth-opacity', '0');
    root.style.setProperty('--mouth-shadow-opacity', '0.14');
    root.style.setProperty('--mouth-shift-x', '0%');
    root.style.setProperty('--mouth-width-scale', '1');
  }

  function setMouthFrame() {
    mouthTick += 1;
    const reduced = reducedMotion?.matches === true;
    // Temporary speech motion; replace these values with real volume input later.
    const base = mouthTick % 4 === 0 ? 0.16 : 0.04;
    const open = reduced ? 0.18 : Math.min(0.92, base + Math.random() * 0.78);
    const opacity = reduced ? 0.2 : 0.18 + open * 0.56;
    const shadowOpacity = reduced ? 0.22 : 0.2 + open * 0.28;
    const shift = reduced ? 0 : (Math.random() - 0.5) * 1.8;
    const width = reduced ? 1 : 0.96 + Math.random() * 0.16;
    root.style.setProperty('--mouth-open', open.toFixed(2));
    root.style.setProperty('--mouth-opacity', opacity.toFixed(2));
    root.style.setProperty('--mouth-shadow-opacity', shadowOpacity.toFixed(2));
    root.style.setProperty('--mouth-shift-x', `${shift.toFixed(2)}%`);
    root.style.setProperty('--mouth-width-scale', width.toFixed(2));
  }

  function startMouthMotion() {
    if (mouthTimer !== null) return;
    setMouthFrame();
    mouthTimer = window.setInterval(setMouthFrame, reducedMotion?.matches === true ? 320 : 160);
  }

  function stopMouthMotion() {
    if (mouthTimer !== null) {
      clearInterval(mouthTimer);
      mouthTimer = null;
    }
    mouthTick = 0;
    setClosedMouth();
  }

  function setFilmPressureRest() {
    root.style.setProperty('--film-press', '0');
    root.style.setProperty('--left-dent-pressure', '0');
    root.style.setProperty('--right-dent-pressure', '0');
    root.style.setProperty('--film-tremble-x', '0px');
    root.style.setProperty('--film-tremble-y', '0px');
    root.style.setProperty('--texture-tremble-x', '0px');
    root.style.setProperty('--texture-tremble-y', '0px');
  }

  function setFilmPressureFrame() {
    const reduced = reducedMotion?.matches === true;
    const intensity = reduced ? 0.18 : 0.42 + Math.random() * 0.42;
    const pattern = Math.random();
    const left = pattern < 0.78 ? intensity : intensity * 0.32;
    const right = pattern > 0.22 ? intensity * (0.82 + Math.random() * 0.18) : intensity * 0.28;
    const trembleX = reduced ? 0 : (Math.random() - 0.5) * 2.2;
    const trembleY = reduced ? 0 : (Math.random() - 0.5) * 1.6;
    const textureTrembleX = trembleX * 0.22;
    const textureTrembleY = trembleY * 0.22;
    root.style.setProperty('--film-press', intensity.toFixed(2));
    root.style.setProperty('--left-dent-pressure', left.toFixed(2));
    root.style.setProperty('--right-dent-pressure', right.toFixed(2));
    root.style.setProperty('--film-tremble-x', `${trembleX.toFixed(2)}px`);
    root.style.setProperty('--film-tremble-y', `${trembleY.toFixed(2)}px`);
    root.style.setProperty('--texture-tremble-x', `${textureTrembleX.toFixed(2)}px`);
    root.style.setProperty('--texture-tremble-y', `${textureTrembleY.toFixed(2)}px`);
    if (pressureReleaseTimer !== null) clearTimeout(pressureReleaseTimer);
    pressureReleaseTimer = window.setTimeout(() => {
      pressureReleaseTimer = null;
      setFilmPressureRest();
    }, reduced ? 180 : 100 + Math.random() * 200);
  }

  function scheduleFilmPressure(delayOverride = null) {
    if (!pressureRunning || pressureTimer !== null) return;
    const reduced = reducedMotion?.matches === true;
    const delay = delayOverride ?? (reduced ? 1800 + Math.random() * 1200 : 650 + Math.random() * 1400);
    pressureTimer = window.setTimeout(() => {
      pressureTimer = null;
      if (!pressureRunning) return;
      setFilmPressureFrame();
      scheduleFilmPressure();
    }, delay);
  }

  function startFilmPressure() {
    if (pressureRunning) return;
    pressureRunning = true;
    setFilmPressureRest();
    scheduleFilmPressure(reducedMotion?.matches === true ? 520 : 220 + Math.random() * 180);
  }

  function stopFilmPressure() {
    pressureRunning = false;
    if (pressureTimer !== null) {
      clearTimeout(pressureTimer);
      pressureTimer = null;
    }
    if (pressureReleaseTimer !== null) {
      clearTimeout(pressureReleaseTimer);
      pressureReleaseTimer = null;
    }
    setFilmPressureRest();
  }

  function update(avatarState, options = {}) {
    const nextState = classByState[avatarState] ? avatarState : AVATAR_STATES.IDLE_BREATHING;
    const restart = options.restart === true;
    if (nextState === currentState && !restart) return nextState;
    if (nextState !== AVATAR_STATES.SYSTEM_SPEAKING) {
      stopMouthMotion();
      stopFilmPressure();
    }
    root.classList.remove(...classes);
    if (restart) {
      root.dataset.state = 'restarting';
      void root.offsetWidth;
    }
    root.classList.add(classByState[nextState]);
    root.dataset.state = nextState;
    if (nextState === AVATAR_STATES.SYSTEM_SPEAKING) {
      startMouthMotion();
      startFilmPressure();
    }
    currentState = nextState;
    return nextState;
  }

  function destroy() {
    stopMouthMotion();
    stopFilmPressure();
    currentState = null;
  }

  setClosedMouth();
  setFilmPressureRest();
  return { root, update, destroy };
}

function createAvatarAnimationController(silhouetteStage) {
  let currentState = null;
  let latestInputs = {};
  let greetingActive = false;
  let lastGreetingInput = false;
  let lastGreetingKey = null;

  function resolveState(inputs, includeGreeting = true) {
    if (includeGreeting && greetingActive) return AVATAR_STATES.GREETING_WAVE;
    if (inputs.systemSpeaking) return AVATAR_STATES.SYSTEM_SPEAKING;
    if (inputs.audienceSpeaking) return AVATAR_STATES.AUDIENCE_SPEAKING;
    return AVATAR_STATES.IDLE_BREATHING;
  }

  function applyState(requestedState, options = {}) {
    if (requestedState === currentState && options.restart !== true) return requestedState;
    silhouetteStage.update(requestedState, options);
    currentState = requestedState;
    return requestedState;
  }

  function update(inputs) {
    latestInputs = inputs;
    const greetingKey = inputs.greetingKey || 'greeting';
    const shouldStartGreeting = inputs.greeting === true && (
      lastGreetingInput !== true ||
      (inputs.greetingReplay === true && greetingKey !== lastGreetingKey)
    );
    lastGreetingInput = inputs.greeting === true;
    if (shouldStartGreeting) {
      greetingActive = true;
      lastGreetingKey = greetingKey;
      return applyState(AVATAR_STATES.GREETING_WAVE, { restart: currentState === AVATAR_STATES.GREETING_WAVE });
    }
    return applyState(resolveState(inputs));
  }

  silhouetteStage.root.addEventListener('animationend', event => {
    if (
      event.animationName !== 'avatar-greeting-hand-wave' ||
      !event.target.classList.contains('avatar-right-hand')
    ) {
      return;
    }
    greetingActive = false;
    latestAvatarState = applyState(resolveState(latestInputs, false));
    syncAvatarDevelopmentPanel();
  });

  function destroy() {
    greetingActive = false;
    currentState = null;
    lastGreetingInput = false;
    lastGreetingKey = null;
    silhouetteStage.destroy?.();
  }

  return { update, resolveState, destroy };
}

function isAvatarDevelopmentPanelAllowed() {
  const allowedHosts = new Set(['localhost', '127.0.0.1', '0.0.0.0', '::1']);
  return allowedHosts.has(window.location.hostname) &&
    new URLSearchParams(window.location.search).get('avatarPanel') === '1';
}

function createAvatarDevelopmentPanel() {
  if (!isAvatarDevelopmentPanelAllowed()) return null;

  const panel = document.createElement('aside');
  panel.className = 'avatar-dev-panel';
  panel.setAttribute('aria-label', 'Avatar development panel');

  const title = document.createElement('div');
  title.className = 'avatar-dev-title';
  title.textContent = 'Avatar Dev';
  panel.appendChild(title);

  const readout = document.createElement('div');
  readout.className = 'avatar-dev-readout';
  const stateLine = document.createElement('div');
  const sourceLine = document.createElement('div');
  const businessLine = document.createElement('div');
  const appliedLine = document.createElement('div');
  readout.append(stateLine, sourceLine, businessLine, appliedLine);
  panel.appendChild(readout);

  const actions = document.createElement('div');
  actions.className = 'avatar-dev-actions';
  const actionItems = [
    ['auto', 'Auto'],
    [AVATAR_STATES.IDLE_BREATHING, 'idle_breathing'],
    [AVATAR_STATES.GREETING_WAVE, 'greeting_wave'],
    [AVATAR_STATES.SYSTEM_SPEAKING, 'system_speaking'],
    [AVATAR_STATES.AUDIENCE_SPEAKING, 'audience_speaking'],
  ];
  const buttons = new Map();
  for (const [state, label] of actionItems) {
    const control = document.createElement('button');
    control.type = 'button';
    control.textContent = label;
    control.addEventListener('click', () => setManualAvatarState(state));
    buttons.set(state, control);
    actions.appendChild(control);
  }
  panel.appendChild(actions);
  document.body.appendChild(panel);
  return { panel, stateLine, sourceLine, businessLine, appliedLine, buttons };
}

function inputLine(inputs) {
  return [
    `greeting=${inputs.greeting === true}`,
    `systemSpeaking=${inputs.systemSpeaking === true}`,
    `audienceSpeaking=${inputs.audienceSpeaking === true}`,
  ].join(' ');
}

function syncAvatarDevelopmentPanel() {
  if (!avatarDevPanel) return;
  avatarDevPanel.stateLine.textContent = `avatarState=${latestAvatarState}`;
  avatarDevPanel.sourceLine.textContent = `source=${avatarManualInputs ? 'manual' : 'business'}`;
  avatarDevPanel.businessLine.textContent = `business ${inputLine(latestAvatarBusinessInputs)}`;
  avatarDevPanel.appliedLine.textContent = `applied ${inputLine(latestAvatarAppliedInputs)}`;
  for (const [state, control] of avatarDevPanel.buttons) {
    control.classList.toggle('is-active', state === avatarManualMode);
  }
}

function setManualAvatarState(state) {
  if (state === 'auto') {
    avatarManualInputs = null;
    avatarManualMode = 'auto';
    latestAvatarAppliedInputs = latestAvatarBusinessInputs;
    latestAvatarState = avatarController.update(latestAvatarAppliedInputs);
    syncAvatarDevelopmentPanel();
    return;
  }

  avatarManualMode = state;
  if (state === AVATAR_STATES.GREETING_WAVE) {
    avatarManualGreetingCount += 1;
    avatarManualInputs = {
      greeting: true,
      greetingKey: `manual-greeting-${avatarManualGreetingCount}`,
      greetingReplay: true,
      systemSpeaking: false,
      audienceSpeaking: false,
    };
  } else {
    avatarManualInputs = {
      greeting: false,
      greetingKey: `manual-${state}`,
      greetingReplay: false,
      systemSpeaking: state === AVATAR_STATES.SYSTEM_SPEAKING,
      audienceSpeaking: state === AVATAR_STATES.AUDIENCE_SPEAKING,
    };
  }
  latestAvatarAppliedInputs = avatarManualInputs;
  latestAvatarState = avatarController.update(avatarManualInputs);
  syncAvatarDevelopmentPanel();
}

function avatarInputsFromDisplayState(state, mode) {
  const text = cleanText(state.display_text);
  const languageGateText = text.includes('Hi. 你好～ Do you want to talk in 中文 or English?');
  return {
    // greeting: the opening hello and language choice phase.
    greeting: state.avatar_greeting === true || languageGateText,
    greetingKey: cleanText(state.updated_at) || text,
    greetingReplay: mode === 'robot_speaking',
    // systemSpeaking: an audible shopkeeper or system line is active.
    systemSpeaking: state.avatar_system_speaking === true || mode === 'robot_speaking' || state.robot_active === true,
    // audienceSpeaking: visitor speech was detected by the control page.
    audienceSpeaking: state.avatar_audience_speaking === true,
  };
}

function render(state) {
  const mode = cleanText(state.mode) || 'idle';
  stage.classList.remove(...stateClasses);
  stage.classList.add(classForMode(mode));
  latestAvatarBusinessInputs = avatarInputsFromDisplayState(state, mode);
  latestAvatarAppliedInputs = avatarManualInputs || latestAvatarBusinessInputs;
  latestAvatarState = avatarController.update(latestAvatarAppliedInputs);
  syncAvatarDevelopmentPanel();
  promptCueCard.render({
    mode,
    displayText: state.display_text,
    foodName: state.food_name,
    foodSubtitle: state.food_subtitle,
  });
}

async function refresh() {
  try {
    const response = await fetch('/api/v1/display-state', { cache: 'no-store' });
    if (!response.ok) return;
    render(await response.json());
  } catch (_err) {
    render({ mode: 'error' });
  }
}

function startRefreshLoop() {
  if (refreshTimer !== null) return;
  refreshTimer = window.setInterval(refresh, 750);
}

function stopRefreshLoop() {
  if (refreshTimer !== null) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

function pauseAvatarRuntime() {
  stopRefreshLoop();
  avatarController.destroy();
}

function resumeAvatarRuntime() {
  refresh();
  startRefreshLoop();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseAvatarRuntime();
  } else {
    resumeAvatarRuntime();
  }
});

window.addEventListener('pagehide', pauseAvatarRuntime);
window.addEventListener('pageshow', resumeAvatarRuntime);

avatarDevPanel = createAvatarDevelopmentPanel();
syncAvatarDevelopmentPanel();
refresh();
startRefreshLoop();
</script>
</body>
</html>
