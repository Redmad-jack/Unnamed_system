<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Have Some "Ai"</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #101211;
    --panel: #181b19;
    --panel-2: #20241f;
    --line: #30382f;
    --text: #eef0e8;
    --dim: #969d90;
    --green: #8bcf8b;
    --red: #ef7d6f;
    --blue: #8ab4f8;
    --gold: #f0c866;
    --ink: #080908;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  header {
    min-height: 56px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: #151815;
    flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .badge, .pill {
    font-family: var(--mono);
    font-size: 12px;
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 999px;
    color: var(--dim);
  }
  .badge { color: var(--green); border-radius: 4px; border-color: #456246; }
  .layout {
    min-height: calc(100vh - 56px);
    display: grid;
    grid-template-columns: minmax(420px, 1.2fr) minmax(360px, 0.8fr);
  }
  main {
    padding: 24px;
    border-right: 1px solid var(--line);
  }
  aside { background: #131612; }
  section + section { margin-top: 18px; }
  .band {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
  }
  .band-title {
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .band-body { padding: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    min-height: 36px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px 12px;
    font: 600 14px var(--sans);
    cursor: pointer;
  }
  button:hover { border-color: var(--blue); }
  button.primary { background: var(--green); color: var(--ink); border-color: var(--green); }
  button.warn { color: var(--red); border-color: #6d3933; }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #101210;
    color: var(--text);
    min-height: 38px;
    padding: 8px 10px;
    font: 14px var(--sans);
  }
  textarea { min-height: 78px; resize: vertical; }
  label {
    display: block;
    color: var(--dim);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .participant-code {
    font-family: var(--mono);
    font-size: clamp(44px, 8vw, 92px);
    line-height: .95;
    color: var(--gold);
  }
  .status-line { color: var(--dim); font-family: var(--mono); font-size: 13px; }
  .question {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .question:first-child { border-top: 0; padding-top: 0; }
  .question.active { background: #1b201b; margin: 0 -16px; padding: 16px; }
  .module {
    color: var(--blue);
    font-size: 12px;
    font-family: var(--mono);
    margin-bottom: 8px;
  }
  .q-text { font-size: 18px; line-height: 1.45; margin-bottom: 6px; }
  .q-text.zh { color: var(--gold); }
  .choices {
    display: grid;
    gap: 8px;
    margin-top: 14px;
  }
  .choice {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 10px;
    align-items: start;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #101210;
  }
  .choice-letter {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--gold);
    color: var(--ink);
    font: 700 14px var(--mono);
  }
  .choice-text { line-height: 1.35; }
  .choice-zh { color: var(--gold); margin-top: 3px; }
  .transcript {
    margin-top: 12px;
    padding: 10px;
    min-height: 44px;
    background: #101210;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    line-height: 1.45;
  }
  .result {
    margin-top: 10px;
    display: grid;
    gap: 5px;
    color: var(--dim);
    font-size: 13px;
  }
  .conversation {
    margin-top: 14px;
    display: grid;
    gap: 8px;
  }
  .shopkeeper-reply {
    font-size: 18px;
    line-height: 1.45;
    color: var(--gold);
  }
  .assignment {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: end;
  }
  .food {
    font-size: clamp(30px, 6vw, 58px);
    line-height: 1;
    font-weight: 750;
  }
  .food-zh {
    font-size: clamp(24px, 4vw, 42px);
    line-height: 1.15;
    color: var(--gold);
    margin-top: 6px;
  }
  .score {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    margin-top: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    text-align: left;
  }
  th { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  td.code { color: var(--gold); font-family: var(--mono); }
  .side-pad { padding: 18px; }
  .muted { color: var(--dim); }
  .hidden { display: none; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    main { border-right: 0; border-bottom: 1px solid var(--line); }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Have Some "Ai"</h1>
  <span id="health" class="badge">connecting</span>
  <span id="voiceState" class="pill">voice idle</span>
  <button id="hardwareButtonConnectBtn" onclick="connectHardwareButton()">Connect Button</button>
  <span id="hardwareButtonState" class="pill">button disconnected</span>
  <span class="pill">AI-generated voice / AI 生成语音</span>
</header>

<div class="layout">
  <main>
    <section class="band">
      <div class="band-title">
        <span>Participant / 观众</span>
        <button id="newParticipantBtn" class="primary" onclick="newParticipant()">New</button>
      </div>
      <div class="band-body">
        <div class="grid-2">
          <div>
            <label>Notes</label>
            <input id="notes" placeholder="optional">
          </div>
          <div>
            <label>Safety flags / 忌口与安全</label>
            <input id="safety" placeholder="allergy, vegetarian, no dairy">
          </div>
        </div>
        <div style="height:16px"></div>
        <div id="participantView" class="hidden">
          <div class="participant-code" id="publicCode"></div>
          <div class="status-line" id="participantStatus"></div>
          <div style="height:12px"></div>
          <div class="row">
            <button onclick="startQuestionnaire()">Start Questions</button>
            <button id="voiceBtn" onclick="startVoiceSession()" disabled>Start Voice</button>
            <button id="stopVoiceBtn" class="warn" onclick="stopVoiceSession()" disabled>Stop Voice</button>
          </div>
          <div id="conversationView" class="conversation hidden">
            <div class="module" id="conversationStage"></div>
            <div class="shopkeeper-reply" id="shopkeeperReply"></div>
            <div class="transcript" id="visitorTranscript"></div>
            <div class="result">
              <span id="conversationProgress"></span>
              <span id="conversationQuestion"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="band">
      <div class="band-title">
        <span>Questions / 问题</span>
        <span class="pill" id="questionProgress">0/0</span>
      </div>
      <div class="band-body" id="questionsBody">
        <span class="muted">No active participant.</span>
      </div>
    </section>

    <section class="band">
      <div class="band-title">
        <span>Transcript fallback / 转写调试</span>
        <button id="manualSubmitBtn" onclick="submitManualTranscript()" disabled>Submit</button>
      </div>
      <div class="band-body">
        <label>Use this only when streaming voice is unavailable.</label>
        <textarea id="manualTranscript" placeholder="Paste or type the visitor transcript here."></textarea>
      </div>
    </section>

    <section id="assignmentBand" class="band hidden">
      <div class="band-title">
        <span>Assignment / 分配结果</span>
        <span class="pill" id="assignmentCode"></span>
      </div>
      <div class="band-body">
        <div class="assignment">
          <div>
            <div class="food" id="foodLabel"></div>
            <div class="food-zh" id="foodLabelZh"></div>
            <div class="score" id="scoreLine"></div>
          </div>
          <button onclick="refreshQueue()">Queue</button>
        </div>
      </div>
    </section>
  </main>

  <aside>
    <div class="side-pad">
      <section class="band">
        <div class="band-title">
          <span>Staff Queue</span>
          <button onclick="refreshQueue()">Refresh</button>
        </div>
        <div class="band-body" style="padding:0">
          <table>
            <thead>
              <tr>
                <th>Code</th>
                <th>Food</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="queueBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </aside>
</div>

<script>
let currentParticipant = null;
let currentQuestions = [];
let activeQuestionIndex = 0;
let voiceAnswers = {};
let conversationState = null;
let responseLanguage = null;
let voiceConfig = null;
let voiceRunActive = false;
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
let audioContext = null;
let analyser = null;
let vadFrame = null;
let vadFallbackTimer = null;
let recordingCancelled = false;
let recordingStopReason = 'idle';
let recordingStopRequested = false;
let recordingStartedAt = 0;
let activeRecordingMimeType = '';
let pendingTranscript = '';
let doubaoSocket = null;
let doubaoStreamCaptureActive = false;
let doubaoStreamClosing = false;
let doubaoInputContext = null;
let doubaoPlaybackContext = null;
let doubaoPlaybackTime = 0;
let doubaoProcessor = null;
let doubaoSource = null;
let doubaoCloseTimer = null;
let doubaoTurnHadConversation = false;
let doubaoPcmBuffer = new Uint8Array(0);
let doubaoPlaybackSources = new Set();
let doubaoDiscardPlayback = false;
let doubaoLastInterruptAt = 0;
let doubaoInterruptResetTimer = null;
let doubaoPlaybackStartedAt = 0;
let doubaoLastMicRms = 0;
let doubaoPlaybackSpeechFrames = 0;
let doubaoAudienceSpeechFrames = 0;
let doubaoMicMutedForTts = false;
let doubaoOutputSampleRate = 24000;
let currentTtsDisplayText = '';
let displaySpeechFallbackTimer = null;
let displayAfterSpeechTimer = null;
let displayAudienceResumeTimer = null;
let displayAudienceSpeaking = false;
let displayAudienceSpeakingTimer = null;
let displayStandbyTimer = null;
let displayFormalAnswerGreetingUntil = 0;
let voiceSessionSilenceTimer = null;
let voiceSessionSilenceResumeTimer = null;
let voiceSessionSilenceWatchActive = false;
let voiceSessionSilencePaused = false;
let voiceSessionSilenceTimedOut = false;
let hardwareButtonPort = null;
let hardwareButtonReader = null;
let hardwareButtonBuffer = '';
let hardwareButtonReadLoopActive = false;
let hardwareButtonNewInProgress = false;
let hardwareButtonLastTriggerAt = 0;
let displayWakeChannel = null;
let displayWakeNewInProgress = false;
let displayWakeLastTriggerAt = 0;

const VAD = {
  calibrationMs: 600,
  minSpeechMs: 500,
  silenceMs: 1100,
  maxRecordingMs: 12000,
  noSpeechTimeoutMs: 15000,
};

const DOUBAO_STREAM = {
  localInterruptEnabled: false,
  audienceActivityRms: 0.035,
  audienceActivityFrames: 4,
  playbackMicForwardRms: 0.12,
  playbackMicForwardFrames: 3,
  providerInterruptGraceMs: 2500,
  interruptResetMs: 4500,
};

const VOICE_SESSION_SILENCE_TIMEOUT_MS = 15000;
const DISPLAY_SPEECH_FALLBACK_MS = 20000;
const DISPLAY_AUDIENCE_SPEECH_HOLD_MS = 1200;
const DISPLAY_RESULT_HOLD_MS = 8000;
const DISPLAY_FORMAL_ANSWER_GREETING_MS = 2300;
const DISPLAY_WAKE_TEXT = '按按钮叫醒我\nPress the button to wake me';
const DISPLAY_AVATAR_DEBUG = new URLSearchParams(window.location.search).has('avatarDebug');
const DISPLAY_WAKE_CHANNEL = {
  name: 'have_some_ai_wake',
  requestType: 'particle_display_wake_request',
  ackType: 'control_wake_ack',
  triggerCooldownMs: 1200,
};
const HARDWARE_BUTTON = {
  baudRate: 115200,
  newCommand: 'NEW',
  triggerCooldownMs: 1200,
};

const foodZh = {
  soup: '汤',
  salad: '沙拉',
  aimiao_soup: '艾苗汤',
  aimiao_salad: '艾苗沙拉',
};

const displayAvatarAdapter = createDisplayAvatarStateAdapter();

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || response.statusText);
  }
  return response.json();
}

function setHardwareButtonState(text, tone = 'dim') {
  const state = document.getElementById('hardwareButtonState');
  if (!state) return;
  state.textContent = text;
  const colors = {
    dim: 'var(--dim)',
    green: 'var(--green)',
    red: 'var(--red)',
    gold: 'var(--gold)',
  };
  state.style.color = colors[tone] || colors.dim;
}

function updateHardwareButtonControls() {
  const connectBtn = document.getElementById('hardwareButtonConnectBtn');
  if (!connectBtn) return;
  if (!('serial' in navigator)) {
    connectBtn.disabled = true;
    connectBtn.textContent = 'No Serial';
    return;
  }
  connectBtn.disabled = Boolean(hardwareButtonPort);
  connectBtn.textContent = hardwareButtonPort ? 'Button Connected' : 'Connect Button';
}

function initializeHardwareButtonControls() {
  updateHardwareButtonControls();
  if (!('serial' in navigator)) {
    setHardwareButtonState('serial unsupported', 'dim');
    console.info('hardware button serial unavailable: Web Serial is not supported');
    return;
  }
  setHardwareButtonState('button disconnected', 'dim');
  navigator.serial.addEventListener('disconnect', (event) => {
    const disconnectedPort = event.port || event.target;
    if (disconnectedPort === hardwareButtonPort) {
      console.info('hardware button serial disconnected');
      closeHardwareButtonPort('button disconnected');
    }
  });
}

function initializeDisplayWakeChannel() {
  if (!('BroadcastChannel' in window)) {
    console.info('display wake channel unavailable: BroadcastChannel is not supported');
    return;
  }
  displayWakeChannel = new BroadcastChannel(DISPLAY_WAKE_CHANNEL.name);
  displayWakeChannel.addEventListener('message', event => {
    void handleDisplayWakeChannelMessage(event.data);
  });
}

async function handleDisplayWakeChannelMessage(message) {
  if (!message || message.type !== DISPLAY_WAKE_CHANNEL.requestType) return;
  const requestId = String(message.requestId || '');
  await triggerDisplayWakeNewParticipant(requestId);
}

function postDisplayWakeAck(requestId, status) {
  if (!displayWakeChannel || !requestId) return;
  displayWakeChannel.postMessage({
    type: DISPLAY_WAKE_CHANNEL.ackType,
    requestId,
    status,
    sentAt: Date.now(),
  });
}

async function triggerDisplayWakeNewParticipant(requestId) {
  const now = Date.now();
  if (displayWakeNewInProgress || now - displayWakeLastTriggerAt < DISPLAY_WAKE_CHANNEL.triggerCooldownMs) {
    postDisplayWakeAck(requestId, 'ignored');
    return;
  }
  displayWakeLastTriggerAt = now;
  displayWakeNewInProgress = true;
  console.info('display wake trigger: calling existing newParticipant()', { requestId });
  try {
    await newParticipant();
    postDisplayWakeAck(requestId, 'created');
  } catch (error) {
    postDisplayWakeAck(requestId, 'failed');
    console.error('display wake new participant failed', error);
  } finally {
    displayWakeNewInProgress = false;
  }
}

async function connectHardwareButton() {
  if (!('serial' in navigator)) {
    setHardwareButtonState('serial unsupported', 'dim');
    console.info('hardware button serial unavailable: Web Serial is not supported');
    return;
  }
  if (hardwareButtonPort) {
    setHardwareButtonState('button connected', 'green');
    return;
  }

  unlockDoubaoPlaybackForGesture();
  setHardwareButtonState('selecting button', 'gold');
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: HARDWARE_BUTTON.baudRate });
    hardwareButtonPort = port;
    hardwareButtonReadLoopActive = true;
    hardwareButtonBuffer = '';
    setHardwareButtonState('button connected', 'green');
    updateHardwareButtonControls();
    console.info('hardware button serial connected', {
      baudRate: HARDWARE_BUTTON.baudRate,
    });
    readHardwareButtonLoop(port);
  } catch (error) {
    hardwareButtonPort = null;
    hardwareButtonReadLoopActive = false;
    setHardwareButtonState('button unavailable', 'red');
    updateHardwareButtonControls();
    console.error('hardware button serial connection failed', error);
  }
}

async function readHardwareButtonLoop(port) {
  const decoder = new TextDecoder();
  try {
    while (port.readable && hardwareButtonReadLoopActive) {
      hardwareButtonReader = port.readable.getReader();
      try {
        while (hardwareButtonReadLoopActive) {
          const { value, done } = await hardwareButtonReader.read();
          if (done) break;
          if (value) {
            readHardwareButtonText(decoder.decode(value, { stream: true }));
          }
        }
      } finally {
        hardwareButtonReader.releaseLock();
        hardwareButtonReader = null;
      }
    }
  } catch (error) {
    if (hardwareButtonReadLoopActive) {
      console.error('hardware button serial read failed', error);
      setHardwareButtonState('button read failed', 'red');
    }
  } finally {
    if (hardwareButtonPort === port) {
      await closeHardwareButtonPort('button disconnected');
    }
  }
}

function readHardwareButtonText(text) {
  hardwareButtonBuffer += text;
  const lines = hardwareButtonBuffer.split(/\r?\n/);
  hardwareButtonBuffer = lines.pop() || '';
  if (hardwareButtonBuffer.length > 160) {
    hardwareButtonBuffer = hardwareButtonBuffer.slice(-160);
  }
  for (const line of lines) {
    handleHardwareButtonLine(line);
  }
}

function handleHardwareButtonLine(rawLine) {
  const line = String(rawLine || '').trim();
  if (!line) return;
  console.info('hardware button serial line', { line });
  if (line === HARDWARE_BUTTON.newCommand) {
    triggerHardwareNewParticipant(line);
    return;
  }
  if (line.startsWith('READY')) {
    setHardwareButtonState('button ready', 'green');
  }
}

async function triggerHardwareNewParticipant(command) {
  const now = Date.now();
  if (hardwareButtonNewInProgress || now - hardwareButtonLastTriggerAt < HARDWARE_BUTTON.triggerCooldownMs) {
    console.info('hardware button trigger ignored', {
      command,
      inProgress: hardwareButtonNewInProgress,
    });
    return;
  }

  hardwareButtonLastTriggerAt = now;
  hardwareButtonNewInProgress = true;
  setHardwareButtonState('button pressed', 'gold');
  console.info('hardware button trigger: calling existing newParticipant()', { command });
  try {
    await newParticipant();
    setHardwareButtonState(
      currentParticipant?.public_code
        ? `created ${currentParticipant.public_code}`
        : 'participant created',
      'green',
    );
  } catch (error) {
    setHardwareButtonState('button trigger failed', 'red');
    console.error('hardware button new participant failed', error);
  } finally {
    hardwareButtonNewInProgress = false;
  }
}

async function closeHardwareButtonPort(stateText = 'button disconnected') {
  hardwareButtonReadLoopActive = false;
  const port = hardwareButtonPort;
  hardwareButtonPort = null;
  hardwareButtonBuffer = '';
  if (hardwareButtonReader) {
    try { await hardwareButtonReader.cancel(); } catch {}
  }
  if (port) {
    try { await port.close(); } catch {}
  }
  setHardwareButtonState(stateText, 'dim');
  updateHardwareButtonControls();
}

function clearVoiceSessionSilenceTimer() {
  if (voiceSessionSilenceTimer) {
    clearTimeout(voiceSessionSilenceTimer);
    voiceSessionSilenceTimer = null;
  }
}

function clearVoiceSessionSilenceResumeTimer() {
  if (voiceSessionSilenceResumeTimer) {
    clearTimeout(voiceSessionSilenceResumeTimer);
    voiceSessionSilenceResumeTimer = null;
  }
}

function startVoiceSessionSilenceWatch() {
  voiceSessionSilenceWatchActive = true;
  voiceSessionSilencePaused = false;
  voiceSessionSilenceTimedOut = false;
  clearVoiceSessionSilenceResumeTimer();
  scheduleVoiceSessionSilenceTimer();
}

function stopVoiceSessionSilenceWatch() {
  voiceSessionSilenceWatchActive = false;
  voiceSessionSilencePaused = false;
  voiceSessionSilenceTimedOut = false;
  clearVoiceSessionSilenceTimer();
  clearVoiceSessionSilenceResumeTimer();
}

function pauseVoiceSessionSilenceWatch() {
  if (!voiceSessionSilenceWatchActive) return;
  voiceSessionSilencePaused = true;
  clearVoiceSessionSilenceTimer();
  clearVoiceSessionSilenceResumeTimer();
}

function resumeVoiceSessionSilenceWatch(delayMs = 0) {
  if (!voiceSessionSilenceWatchActive || voiceSessionSilenceTimedOut) return;
  clearVoiceSessionSilenceResumeTimer();
  const ms = Math.max(0, Number(delayMs) || 0);
  if (ms > 16) {
    voiceSessionSilenceResumeTimer = window.setTimeout(() => {
      voiceSessionSilenceResumeTimer = null;
      voiceSessionSilencePaused = false;
      scheduleVoiceSessionSilenceTimer();
    }, ms);
    return;
  }
  voiceSessionSilencePaused = false;
  scheduleVoiceSessionSilenceTimer();
}

function markVoiceSessionAudienceActivity() {
  if (
    !voiceSessionSilenceWatchActive ||
    voiceSessionSilencePaused ||
    voiceSessionSilenceTimedOut ||
    doubaoMicMutedForTts
  ) {
    return;
  }
  scheduleVoiceSessionSilenceTimer();
}

function scheduleVoiceSessionSilenceTimer() {
  clearVoiceSessionSilenceTimer();
  if (
    !voiceSessionSilenceWatchActive ||
    voiceSessionSilencePaused ||
    voiceSessionSilenceTimedOut
  ) {
    return;
  }
  voiceSessionSilenceTimer = window.setTimeout(
    handleVoiceSessionSilenceTimeout,
    VOICE_SESSION_SILENCE_TIMEOUT_MS,
  );
}

function handleVoiceSessionSilenceTimeout() {
  if (
    voiceSessionSilenceTimedOut ||
    voiceSessionSilencePaused ||
    doubaoMicMutedForTts
  ) {
    return;
  }
  const hasOpenCapture =
    voiceRunActive ||
    doubaoStreamCaptureActive ||
    (mediaRecorder && mediaRecorder.state !== 'inactive');
  if (!hasOpenCapture) {
    stopVoiceSessionSilenceWatch();
    return;
  }
  voiceSessionSilenceTimedOut = true;
  console.info('voice session silence timeout: returning to hardware wake state');
  cancelVoiceResources('session_silence_timeout');
  resetControlSessionToStandby();
  syncDisplayStandby();
}

function resetControlSessionToStandby() {
  voiceRunActive = false;
  currentParticipant = null;
  currentQuestions = [];
  activeQuestionIndex = 0;
  voiceAnswers = {};
  conversationState = null;
  responseLanguage = null;
  pendingTranscript = '';
  document.getElementById('participantView').classList.add('hidden');
  document.getElementById('conversationView').classList.add('hidden');
  document.getElementById('publicCode').textContent = '';
  document.getElementById('participantStatus').textContent = '';
  document.getElementById('shopkeeperReply').textContent = '';
  document.getElementById('visitorTranscript').textContent = '';
  document.getElementById('conversationProgress').textContent = '';
  document.getElementById('conversationQuestion').textContent = '';
  document.getElementById('assignmentBand').classList.add('hidden');
  document.getElementById('questionsBody').innerHTML = '<span class="muted">No active participant.</span>';
  document.getElementById('questionProgress').textContent = '0/0';
  document.getElementById('voiceBtn').disabled = true;
  document.getElementById('stopVoiceBtn').disabled = true;
  document.getElementById('manualSubmitBtn').disabled = true;
  setVoiceState('waiting for button');
}

const DISPLAY_FIELDS = [
  'mode',
  'display_text',
  'food_name',
  'food_subtitle',
  'robot_active',
  'avatar_greeting',
  'avatar_system_speaking',
  'avatar_audience_speaking',
];
const DISPLAY_FORBIDDEN_TEXT = [
  '录音中',
  '麦克风',
  'ASR',
  'TTS',
  'WebSocket',
  'conversation-stream',
  'listening',
  'transcribing',
  'thinking',
  'debug',
  'database',
  'queue',
  'participant id',
];

async function updateDisplayState(payload) {
  const body = {};
  for (const field of DISPLAY_FIELDS) {
    if (Object.prototype.hasOwnProperty.call(payload, field)) {
      body[field] = payload[field];
    }
  }
  if (Object.prototype.hasOwnProperty.call(body, 'display_text')) {
    body.display_text = displaySafeText(body.display_text);
  }
  if (Object.prototype.hasOwnProperty.call(body, 'food_name')) {
    body.food_name = displaySafeNullableText(body.food_name);
  }
  if (Object.prototype.hasOwnProperty.call(body, 'food_subtitle')) {
    body.food_subtitle = displaySafeNullableText(body.food_subtitle);
  }
  try {
    const response = await fetch('/api/v1/display-state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!response.ok) throw new Error(response.statusText);
  } catch (error) {
    console.debug('display state sync failed', {
      reason: String(error?.message || error),
    });
  }
}

function createDisplayAvatarStateAdapter() {
  let lastResolvedState = '';

  function withDisplayAvatarState(payload, signals = {}) {
    const isGreetingLanguageSelect = signals.isGreetingLanguageSelect ?? isGreetingDisplayActive();
    const isGreeting = signals.isGreeting ?? isGreetingLanguageSelect;
    const isSystemSpeaking = signals.isSystemSpeaking ?? (
      payload.robot_active === true ||
      payload.mode === 'robot_speaking'
    );
    const isAudienceSpeaking = signals.isAudienceSpeaking ?? displayAudienceSpeaking;
    const avatarSignals = {
      avatar_greeting: isGreeting,
      avatar_system_speaking: isSystemSpeaking,
      avatar_audience_speaking: isAudienceSpeaking && !isSystemSpeaking,
    };
    const resolvedState = resolveDisplayAvatarState(avatarSignals);
    if (DISPLAY_AVATAR_DEBUG && resolvedState !== lastResolvedState) {
      console.debug('display avatar state', {
        state: resolvedState,
        source: signals.source || 'display_sync',
        isGreeting,
        isGreetingLanguageSelect,
        isSystemSpeaking,
        isAudienceSpeaking,
      });
    }
    lastResolvedState = resolvedState;
    return { ...payload, ...avatarSignals };
  }

  return { withDisplayAvatarState };
}

function resolveDisplayAvatarState(signals) {
  if (signals.avatar_greeting) return 'greeting_wave';
  if (signals.avatar_system_speaking) return 'system_speaking';
  if (signals.avatar_audience_speaking) return 'audience_speaking';
  return 'idle_breathing';
}

function withDisplayAvatarState(payload, signals = {}) {
  return displayAvatarAdapter.withDisplayAvatarState(payload, signals);
}

function displaySafeText(value) {
  const text = String(value ?? '').trim();
  if (!text) return '';
  return DISPLAY_FORBIDDEN_TEXT.some(term => text.toLowerCase().includes(term.toLowerCase()))
    ? ''
    : text;
}

function displaySafeNullableText(value) {
  if (value === null || value === undefined) return null;
  const text = displaySafeText(value);
  return text || null;
}

function clearDisplayStandbyTimer() {
  if (displayStandbyTimer) {
    clearTimeout(displayStandbyTimer);
    displayStandbyTimer = null;
  }
}

function syncDisplayStandby() {
  clearDisplaySpeechFallback();
  clearDisplayAfterSpeechTimer();
  clearDisplayAudienceResumeTimer();
  clearDisplayAudienceSpeaking();
  clearDisplayStandbyTimer();
  currentTtsDisplayText = '';
  void updateDisplayState(withDisplayAvatarState({
    mode: 'idle',
    display_text: DISPLAY_WAKE_TEXT,
    food_name: null,
    food_subtitle: null,
    robot_active: false,
  }, {
    source: 'standby',
    isGreetingLanguageSelect: false,
    isSystemSpeaking: false,
    isAudienceSpeaking: false,
  }));
}

function scheduleDisplayStandby(delayMs = DISPLAY_RESULT_HOLD_MS) {
  clearDisplayStandbyTimer();
  displayStandbyTimer = window.setTimeout(syncDisplayStandby, delayMs);
}

function syncDisplayIdle() {
  clearDisplaySpeechFallback();
  clearDisplayAfterSpeechTimer();
  clearDisplayAudienceResumeTimer();
  clearDisplayAudienceSpeaking();
  clearDisplayStandbyTimer();
  currentTtsDisplayText = '';
  void updateDisplayState(withDisplayAvatarState({
    mode: 'idle',
    display_text: '',
    food_name: null,
    food_subtitle: null,
    robot_active: false,
  }, {
    source: 'idle',
    isGreetingLanguageSelect: false,
    isSystemSpeaking: false,
    isAudienceSpeaking: false,
  }));
}

function syncDisplayQuestion(robotActive = false, options = {}) {
  clearDisplayStandbyTimer();
  const questionText = currentDisplayQuestionText();
  if (!questionText) {
    syncDisplayIdle();
    return;
  }
  void updateDisplayState(withDisplayAvatarState({
    mode: 'question',
    display_text: questionText,
    food_name: null,
    food_subtitle: null,
    robot_active: robotActive,
  }, {
    source: robotActive ? 'question_speech' : 'question',
    isGreeting: options.isGreeting,
    isGreetingLanguageSelect: isGreetingDisplayActive(),
    isSystemSpeaking: robotActive,
    isAudienceSpeaking: displayAudienceSpeaking,
  }));
}

function syncDisplayRobotSpeaking(text, options = {}) {
  clearDisplayAfterSpeechTimer();
  clearDisplayAudienceResumeTimer();
  clearDisplayStandbyTimer();
  const displayText = displaySafeText(text) || currentDisplayQuestionText() || '';
  void updateDisplayState(withDisplayAvatarState({
    mode: 'robot_speaking',
    display_text: displayText,
    food_name: null,
    food_subtitle: null,
    robot_active: true,
  }, {
    source: 'system_speaking',
    isGreeting: options.isGreeting,
    isGreetingLanguageSelect: isGreetingDisplayActive(),
    isSystemSpeaking: true,
    isAudienceSpeaking: false,
  }));
}

function syncDisplayAfterSpeech() {
  clearDisplayAfterSpeechTimer();
  clearDisplaySpeechFallback();
  currentTtsDisplayText = '';
  if (conversationState?.assignment) {
    syncDisplayResult(conversationState.assignment);
    return;
  }
  syncDisplayQuestion();
}

function syncDisplayResult(assignment) {
  if (!assignment) return;
  clearDisplayStandbyTimer();
  const language = selectedResponseLanguage();
  const zhLabel = foodZh[assignment.food_code] || '';
  const foodName = language === 'en'
    ? assignment.food_label
    : (zhLabel || assignment.food_label);
  const foodSubtitle = language === 'en'
    ? (zhLabel || null)
    : (assignment.food_label || null);
  void updateDisplayState(withDisplayAvatarState({
    mode: 'result',
    display_text: language === 'en' ? "Today's food is ready" : '今日食物已生成',
    food_name: foodName,
    food_subtitle: foodSubtitle,
    robot_active: false,
  }, {
    source: 'result',
    isGreetingLanguageSelect: false,
    isSystemSpeaking: false,
    isAudienceSpeaking: false,
  }));
}

function isAcceptedFormalAnswerResult(result) {
  const answeredCount = Number(result?.answered_count || 0);
  const totalQuestions = Number(result?.total_questions || 2);
  return (
    result?.interpretation?.status === 'accepted' &&
    Boolean(result?.interpretation?.choice) &&
    answeredCount > 0 &&
    answeredCount <= totalQuestions
  );
}

function shouldKeepDisplayFormalAnswerGreeting() {
  return performance.now() < displayFormalAnswerGreetingUntil;
}

function syncDisplayFormalAnswerGreeting(result) {
  if (!isAcceptedFormalAnswerResult(result)) return false;
  displayFormalAnswerGreetingUntil = performance.now() + DISPLAY_FORMAL_ANSWER_GREETING_MS;
  const systemSpeakingAfterGreeting = Boolean(result?.reply_text && !result?.assignment);
  void updateDisplayState(withDisplayAvatarState({
    robot_active: systemSpeakingAfterGreeting,
  }, {
    source: `formal_answer_greeting_${result.answered_count}`,
    isGreeting: true,
    isGreetingLanguageSelect: false,
    isSystemSpeaking: systemSpeakingAfterGreeting,
    isAudienceSpeaking: false,
  }));
  return true;
}

function syncDisplayError() {
  clearDisplaySpeechFallback();
  clearDisplayAfterSpeechTimer();
  clearDisplayAudienceResumeTimer();
  clearDisplayStandbyTimer();
  currentTtsDisplayText = '';
  void updateDisplayState(withDisplayAvatarState({
    mode: 'error',
    display_text: '暂时无法生成结果',
    food_name: null,
    food_subtitle: null,
    robot_active: false,
  }, {
    source: 'error',
    isGreetingLanguageSelect: false,
    isSystemSpeaking: false,
    isAudienceSpeaking: false,
  }));
}

function isGreetingDisplayActive() {
  return conversationState?.stage === 'language_gate';
}

function currentDisplayQuestionText() {
  if (conversationState?.stage === 'language_gate') {
    return 'Hi. 你好～ Do you want to talk in 中文 or English?\nEnglish\n中文';
  }
  const question = currentDisplayQuestion();
  const language = selectedResponseLanguage();
  const questionText = question
    ? displayQuestionText(question, language)
    : (conversationState?.current_question_text || '');
  if (!questionText) return '';
  const choices = question ? visibleChoices(question)
    .map(choice => displayChoiceText(choice, language))
    .filter(Boolean) : [];
  return [questionText, ...choices].join('\n');
}

function syncDisplayTtsStart(text) {
  pauseVoiceSessionSilenceWatch();
  clearDisplayAfterSpeechTimer();
  clearDisplayAudienceResumeTimer();
  clearDisplayAudienceSpeaking();
  currentTtsDisplayText = displaySafeText(text);
  syncDisplayCurrentTtsSpeaking();
  scheduleDisplaySpeechFallback();
}

function syncDisplayCurrentTtsSpeaking() {
  const keepFormalAnswerGreeting = shouldKeepDisplayFormalAnswerGreeting();
  if (shouldShowQuestionDuringTts()) {
    syncDisplayQuestion(true, { isGreeting: keepFormalAnswerGreeting });
  } else {
    syncDisplayRobotSpeaking(
      currentTtsDisplayText || conversationState?.reply_text || currentDisplayQuestionText(),
      { isGreeting: keepFormalAnswerGreeting },
    );
  }
}

function shouldShowQuestionDuringTts() {
  return /^formal_question_/.test(String(conversationState?.stage || '')) && Boolean(
    currentDisplayQuestion() ||
    conversationState?.current_question_id ||
    conversationState?.current_question_text
  );
}

function scheduleDisplaySpeechFallback() {
  clearDisplaySpeechFallback();
  displaySpeechFallbackTimer = window.setTimeout(syncDisplayAfterSpeech, DISPLAY_SPEECH_FALLBACK_MS);
}

function clearDisplaySpeechFallback() {
  if (displaySpeechFallbackTimer) {
    clearTimeout(displaySpeechFallbackTimer);
    displaySpeechFallbackTimer = null;
  }
}

function scheduleDisplayAfterSpeech(delayMs = 0) {
  clearDisplayAfterSpeechTimer();
  const ms = Math.max(0, Number(delayMs) || 0);
  if (ms <= 16) {
    syncDisplayAfterSpeech();
    return;
  }
  displayAfterSpeechTimer = window.setTimeout(() => {
    displayAfterSpeechTimer = null;
    syncDisplayAfterSpeech();
  }, ms);
}

function clearDisplayAfterSpeechTimer() {
  if (displayAfterSpeechTimer) {
    clearTimeout(displayAfterSpeechTimer);
    displayAfterSpeechTimer = null;
  }
}

function scheduleDisplayAudienceResume(delayMs = 0) {
  clearDisplayAudienceResumeTimer();
  const ms = Math.max(0, Number(delayMs) || 0);
  displayAudienceResumeTimer = window.setTimeout(() => {
    displayAudienceResumeTimer = null;
    if (doubaoStreamCaptureActive && !doubaoMicMutedForTts) {
      setDisplayAudienceSpeaking(true);
    }
  }, ms);
}

function clearDisplayAudienceResumeTimer() {
  if (displayAudienceResumeTimer) {
    clearTimeout(displayAudienceResumeTimer);
    displayAudienceResumeTimer = null;
  }
}

function markDisplayAudienceSpeaking(holdMs = DISPLAY_AUDIENCE_SPEECH_HOLD_MS) {
  setDisplayAudienceSpeaking(true);
  if (displayAudienceSpeakingTimer) clearTimeout(displayAudienceSpeakingTimer);
  displayAudienceSpeakingTimer = window.setTimeout(() => {
    setDisplayAudienceSpeaking(false);
  }, holdMs);
}

function setDisplayAudienceSpeaking(active) {
  if (!active && displayAudienceSpeakingTimer) {
    clearTimeout(displayAudienceSpeakingTimer);
    displayAudienceSpeakingTimer = null;
  }
  if (!active) clearDisplayAudienceResumeTimer();
  if (displayAudienceSpeaking === active) return;
  displayAudienceSpeaking = active;
  void updateDisplayState(withDisplayAvatarState({
    robot_active: false,
  }, {
    source: active ? 'audience_input_active' : 'audience_input_idle',
    isGreetingLanguageSelect: isGreetingDisplayActive(),
    isSystemSpeaking: false,
    isAudienceSpeaking: active,
  }));
}

function clearDisplayAudienceSpeaking() {
  if (displayAudienceSpeakingTimer) {
    clearTimeout(displayAudienceSpeakingTimer);
    displayAudienceSpeakingTimer = null;
  }
  displayAudienceSpeaking = false;
}

function currentDisplayQuestion() {
  if (conversationState?.current_question_id) {
    const matched = currentQuestions.find(q => q.question_id === conversationState.current_question_id);
    if (matched) return matched;
  }
  return currentQuestions[activeQuestionIndex] || null;
}

function displayQuestionText(question, language) {
  if (language === 'en') {
    return question.question_text || question.question_text_zh || '';
  }
  return question.question_text_zh || question.question_text || '';
}

function displayChoiceText(choice, language) {
  const value = language === 'en'
    ? (choice.text || choice.text_zh || '')
    : (choice.text_zh || choice.text || '');
  return value ? `${choice.id}. ${value}` : '';
}

async function getVoiceConfig() {
  if (!voiceConfig) voiceConfig = await api('/api/v1/voice-config');
  return voiceConfig;
}

async function pollHealth() {
  try {
    const h = await api('/health');
    const el = document.getElementById('health');
    el.textContent = h.status;
    el.style.color = h.status === 'ok' ? 'var(--green)' : 'var(--red)';
