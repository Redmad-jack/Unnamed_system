async function newParticipant() {
  unlockDoubaoPlaybackForGesture();
  stopVoiceSession();
  const notes = document.getElementById('notes').value.trim();
  const safetyText = document.getElementById('safety').value.trim();
  const participant = await api('/api/v1/participants', {
    method: 'POST',
    body: JSON.stringify({
      notes: notes || null,
      safety_flags: safetyText ? { raw: safetyText } : {},
    }),
  });
  currentParticipant = participant;
  currentQuestions = [];
  activeQuestionIndex = 0;
  voiceAnswers = {};
  conversationState = null;
  responseLanguage = null;
  renderParticipant();
  document.getElementById('assignmentBand').classList.add('hidden');
  document.getElementById('questionsBody').innerHTML = '<span class="muted">Waiting.</span>';
  document.getElementById('voiceBtn').disabled = true;
  document.getElementById('manualSubmitBtn').disabled = true;
  setVoiceState('voice idle');
  syncDisplayIdle();
  try {
    await startConversationEntry();
  } catch (error) {
    console.error(error);
    setVoiceState('conversation unavailable');
    syncDisplayError();
  }
}

function renderParticipant() {
  document.getElementById('participantView').classList.remove('hidden');
  document.getElementById('publicCode').textContent = currentParticipant.public_code;
  document.getElementById('participantStatus').textContent =
    currentParticipant.status + ' · ' + currentParticipant.id.slice(0, 8);
}

async function startQuestionnaire() {
  if (!currentParticipant) return;
  unlockDoubaoPlaybackForGesture();
  await startConversationEntry();
}

async function startConversationEntry() {
  if (!currentParticipant) return;
  const config = await getVoiceConfig().catch(() => null);
  const useDoubaoStream = isDoubaoStreamConfig(config);
  if (useDoubaoStream) {
    await startDoubaoStreamConversation(config, { prepareTurn: true });
    return;
  }
  let result;
  try {
    result = await api(`/api/v1/participants/${currentParticipant.id}/conversation-turn`, {
      method: 'POST',
      body: JSON.stringify({ transcript: '', include_audio: !useDoubaoStream }),
    });
  } catch (error) {
    if (useDoubaoStream) throw error;
    console.debug('conversation entry speech unavailable', {
      reason: String(error?.message || error),
    });
    result = await api(`/api/v1/participants/${currentParticipant.id}/conversation-turn`, {
      method: 'POST',
      body: JSON.stringify({ transcript: '', include_audio: false }),
    });
  }
  await handleConversationResult(result, {
    playReplyAudio: !useDoubaoStream,
    deferReplyDisplay: useDoubaoStream,
  });
}

function renderQuestions() {
  const body = document.getElementById('questionsBody');
  if (conversationState?.stage === 'language_gate') {
    body.innerHTML = `
      <div class="question active">
        <div class="module">language / 语言</div>
        <div class="q-text">Hi. 你好～ Do you want to talk in 中文 or English?</div>
        <div class="choices">
          <button class="choice" onclick="submitLanguageChoice('English')">
            <div class="choice-text"><div>English</div></div>
          </button>
          <button class="choice" onclick="submitLanguageChoice('中文')">
            <div class="choice-text"><div>中文</div></div>
          </button>
        </div>
      </div>
    `;
    document.getElementById('questionProgress').textContent = 'language';
    return;
  }
  if (!currentQuestions.length) {
    body.innerHTML = '<span class="muted">Waiting.</span>';
    document.getElementById('questionProgress').textContent = '0/0';
    return;
  }
  const language = selectedResponseLanguage();
  body.innerHTML = currentQuestions.map((q, index) => {
    const answer = voiceAnswers[q.question_id];
    const isActive = index === activeQuestionIndex;
    const choices = visibleChoices(q);
    const questionText = language === 'en'
      ? `<div class="q-text">${escapeHtml(q.question_text)}</div>`
      : `
        <div class="q-text">${escapeHtml(q.question_text)}</div>
        <div class="q-text zh">${escapeHtml(q.question_text_zh || '')}</div>
      `;
    const resultText = answer ? answerResultHtml(answer, language) : '<span class="muted">Waiting for spoken answer / 等待语音回答</span>';
    return `
      <div class="question ${isActive ? 'active' : ''}">
        <div class="module">${escapeHtml(q.module_id)} ${isActive ? '· listening / 正在听' : ''}</div>
        ${questionText}
        <div class="choices">
          ${choices.map(choice => {
            const choiceText = language === 'en'
              ? `<div>${escapeHtml(choice.text)}</div>`
              : `
                <div>${escapeHtml(choice.text)}</div>
                <div class="choice-zh">${escapeHtml(choice.text_zh)}</div>
              `;
            return `
            <div class="choice">
              <div class="choice-letter">${escapeHtml(choice.id)}</div>
              <div class="choice-text">
                ${choiceText}
              </div>
            </div>
          `}).join('')}
        </div>
        <div class="transcript">${escapeHtml(answer?.transcript || (isActive ? pendingTranscript || '...' : ''))}</div>
        <div class="result">
          ${resultText}
        </div>
      </div>
    `;
  }).join('');
  const accepted = Object.values(voiceAnswers).filter(item => item.status === 'accepted').length;
  document.getElementById('questionProgress').textContent = `${accepted}/${currentQuestions.length}`;
}

function visibleChoices(q) {
  const optionA = (q.options || []).find(option => option.id === 'A') || {};
  const optionB = (q.options || []).find(option => option.id === 'B') || {};
  return [
    { id: 'A', text: optionA.text || '', text_zh: optionA.text_zh || '' },
    { id: 'B', text: optionB.text || '', text_zh: optionB.text_zh || '' },
  ];
}

function selectedResponseLanguage() {
  return responseLanguage || conversationState?.response_language || 'zh';
}

function answerResultHtml(answer, language) {
  const status = `status=${escapeHtml(answer.status)} · option=${escapeHtml(answer.option_id || '')} · confidence=${escapeHtml(answer.confidence ?? '')}`;
  if (language === 'en') {
    const reason = answer.needs_retry
      ? 'I did not catch that clearly. Please say it again.'
      : (answer.reason_en || '');
    return `
      <span>${status}</span>
      <span>${escapeHtml(reason)}</span>
    `;
  }
  return `
    <span>${status}</span>
    <span>${escapeHtml(answer.reason_en || '')}</span>
    <span>${escapeHtml(answer.needs_retry ? '没太听清，请再说一遍。' : (answer.reason_zh || ''))}</span>
  `;
}

function playAudioBlob(blob, onEnded = null, errorState = 'speech playback failed') {
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  return new Promise((resolve, reject) => {
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      URL.revokeObjectURL(url);
    };
    audio.addEventListener('ended', () => {
      (async () => {
        finish();
        if (onEnded) await onEnded();
        resolve();
      })().catch(error => {
        setVoiceState(errorState);
        reject(error);
      });
    }, { once: true });
    audio.addEventListener('error', () => {
      finish();
      setVoiceState(errorState);
      reject(new Error(errorState));
    }, { once: true });
    audio.play().catch(error => {
      finish();
      setVoiceState(errorState);
      reject(error);
    });
  });
}

async function startVoiceSession() {
  if (!currentParticipant) return;
  unlockDoubaoPlaybackForGesture();
  if (!currentQuestions.length && !conversationState) {
    await startConversationEntry();
    if (doubaoStreamCaptureActive || doubaoSocket) return;
  }
  voiceRunActive = true;
  document.getElementById('voiceBtn').disabled = true;
  document.getElementById('stopVoiceBtn').disabled = false;
  try {
    await beginListeningForCurrentQuestion();
  } catch (error) {
    console.error(error);
    voiceRunActive = false;
    document.getElementById('voiceBtn').disabled = false;
    syncDisplayError();
  }
}

async function beginListeningForCurrentQuestion() {
  const config = await getVoiceConfig().catch(() => null);
  if (isDoubaoStreamConfig(config)) {
    await startDoubaoStreamConversation(config);
    return;
  }
  await startFileRecording();
}

function isDoubaoStreamConfig(config) {
  return config?.provider === 'doubao' && config.conversation_stream_available;
}

async function startDoubaoStreamConversation(config, options = {}) {
  if (!navigator.mediaDevices?.getUserMedia || !window.WebSocket) {
    setVoiceState('doubao stream unavailable');
    return;
  }
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) {
    setVoiceState('doubao stream unavailable');
    return;
  }
  const { prepareTurn = !conversationState } = options;

  cancelVoiceResources('user_cancel');
  doubaoStreamClosing = false;
  doubaoTurnHadConversation = false;
  doubaoDiscardPlayback = false;
  doubaoMicMutedForTts = false;
  doubaoPcmBuffer = new Uint8Array(0);
  doubaoPlaybackStartedAt = 0;
  doubaoLastMicRms = 0;
  doubaoPlaybackSpeechFrames = 0;
  doubaoAudienceSpeechFrames = 0;
  setVoiceState('requesting mic');

  try {
    document.getElementById('voiceBtn').disabled = true;
    document.getElementById('stopVoiceBtn').disabled = false;
    document.getElementById('manualSubmitBtn').disabled = true;
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
    voiceRunActive = true;
  } catch (error) {
    console.error(error);
    setVoiceState('mic permission denied');
    stopVoiceSession();
    return;
  }

  try {
    setVoiceState('connecting doubao');
    doubaoSocket = new WebSocket(doubaoStreamUrl());
    doubaoSocket.binaryType = 'arraybuffer';
    doubaoSocket.addEventListener('message', event => {
      handleDoubaoStreamMessage(event, config).catch(error => {
        console.error(error);
        setVoiceState('doubao stream unavailable');
      });
    });
    doubaoSocket.addEventListener('close', () => {
      if (!doubaoStreamClosing && voiceRunActive) {
        setVoiceState('doubao stream unavailable');
        document.getElementById('voiceBtn').disabled = false;
        document.getElementById('stopVoiceBtn').disabled = true;
      }
      doubaoSocket = null;
    });
    doubaoSocket.addEventListener('error', error => {
      console.error(error);
      setVoiceState('doubao stream unavailable');
    });
    await waitForSocketOpen(doubaoSocket);
    doubaoSocket.send(JSON.stringify({
      type: 'session.start',
      session_id: makeAttemptId('doubao-session'),
      prepare_turn: prepareTurn,
    }));
    startDoubaoPcmCapture(config);
    setVoiceState('listening');
  } catch (error) {
    console.error(error);
    setVoiceState('doubao stream unavailable');
    releaseDoubaoStreamResources('connect_failed');
    voiceRunActive = false;
    document.getElementById('voiceBtn').disabled = false;
    document.getElementById('stopVoiceBtn').disabled = true;
    document.getElementById('manualSubmitBtn').disabled = false;
    syncDisplayError();
  }
}

function doubaoStreamUrl() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${protocol}//${window.location.host}/api/v1/participants/${currentParticipant.id}/conversation-stream`;
}

async function playDoubaoStreamReplyText(text, config) {
  if (!currentParticipant || !text?.trim()) return;
  if (!window.WebSocket || !(window.AudioContext || window.webkitAudioContext)) {
    throw new Error('doubao stream unavailable');
  }

  cancelVoiceResources('tts_only');
  const context = ensureDoubaoPlaybackContext();
  doubaoStreamClosing = false;
  doubaoTurnHadConversation = true;
  doubaoDiscardPlayback = false;
  doubaoMicMutedForTts = true;
  doubaoPcmBuffer = new Uint8Array(0);
  doubaoPlaybackStartedAt = 0;
  doubaoLastMicRms = 0;
  doubaoPlaybackSpeechFrames = 0;
  doubaoAudienceSpeechFrames = 0;
  doubaoPlaybackTime = context.currentTime || 0;
  currentTtsDisplayText = displaySafeText(text);
  document.getElementById('voiceBtn').disabled = true;
  document.getElementById('stopVoiceBtn').disabled = false;
  document.getElementById('manualSubmitBtn').disabled = true;
  setVoiceState('doubao speaking');

  let resolveClosed;
  const closed = new Promise(resolve => {
    resolveClosed = resolve;
  });

  try {
    doubaoSocket = new WebSocket(doubaoStreamUrl());
    doubaoSocket.binaryType = 'arraybuffer';
    doubaoSocket.addEventListener('message', event => {
      handleDoubaoStreamMessage(event, config).catch(error => {
        console.error(error);
        setVoiceState('doubao stream unavailable');
        resolveClosed();
      });
    });
    doubaoSocket.addEventListener('close', () => {
      doubaoSocket = null;
      resolveClosed();
    }, { once: true });
    doubaoSocket.addEventListener('error', error => {
      console.error(error);
      setVoiceState('doubao stream unavailable');
      resolveClosed();
    }, { once: true });

    await waitForSocketOpen(doubaoSocket);
    doubaoSocket.send(JSON.stringify({
      type: 'session.start',
      session_id: makeAttemptId('doubao-tts'),
      prepare_turn: false,
    }));
    doubaoSocket.send(JSON.stringify({
      type: 'tts.speak',
      text,
      response_language: selectedResponseLanguage(),
    }));
    scheduleDoubaoStreamClose(15000);
    await closed;
  } finally {
    document.getElementById('stopVoiceBtn').disabled = true;
    if (currentParticipant) document.getElementById('voiceBtn').disabled = false;
    if (currentParticipant) document.getElementById('manualSubmitBtn').disabled = false;
  }
}

function waitForSocketOpen(socket) {
  return new Promise((resolve, reject) => {
    if (socket.readyState === WebSocket.OPEN) {
      resolve();
      return;
    }
    socket.addEventListener('open', resolve, { once: true });
    socket.addEventListener('error', () => reject(new Error('doubao stream unavailable')), { once: true });
    socket.addEventListener('close', () => reject(new Error('doubao stream unavailable')), { once: true });
  });
}

function startDoubaoPcmCapture(config) {
  doubaoInputContext = new (window.AudioContext || window.webkitAudioContext)();
  doubaoInputContext.resume?.().catch(() => {});
  doubaoSource = doubaoInputContext.createMediaStreamSource(mediaStream);
  doubaoProcessor = doubaoInputContext.createScriptProcessor(4096, 1, 1);
  doubaoStreamCaptureActive = true;
  doubaoAudienceSpeechFrames = 0;
  startVoiceSessionSilenceWatch();
  setDisplayAudienceSpeaking(true);
  doubaoProcessor.onaudioprocess = event => {
    const output = event.outputBuffer.getChannelData(0);
    output.fill(0);
    if (
      !doubaoStreamCaptureActive ||
      doubaoMicMutedForTts ||
      !doubaoSocket ||
      doubaoSocket.readyState !== WebSocket.OPEN
    ) {
      return;
    }
    const input = event.inputBuffer.getChannelData(0);
    const micGate = evaluateDoubaoMicFrame(input);
    if (micGate.interrupt) interruptDoubaoPlayback('local_voice');
    const targetSampleRate = config.input_sample_rate || 16000;
    const pcmBytes = micGate.mask
      ? silentPcm16Bytes(input.length, doubaoInputContext.sampleRate, targetSampleRate)
      : downsampleToPcm16Bytes(input, doubaoInputContext.sampleRate, targetSampleRate);
    if (!pcmBytes.length) return;
    sendDoubaoPcmBytes(pcmBytes, targetSampleRate);
  };
  doubaoSource.connect(doubaoProcessor);
  doubaoProcessor.connect(doubaoInputContext.destination);
}

function finishDoubaoStreamSession() {
  stopDoubaoCaptureOnly();
  flushDoubaoPcmBuffer();
  clearTimeout(doubaoCloseTimer);
  doubaoCloseTimer = null;
  document.getElementById('stopVoiceBtn').disabled = true;
  setVoiceState('processing stream');
  try {
    doubaoSocket.send(JSON.stringify({ type: 'audio.end' }));
  } catch (error) {
    console.error(error);
    setVoiceState('doubao stream unavailable');
    releaseDoubaoStreamResources('send_failed');
    document.getElementById('voiceBtn').disabled = false;
  }
}

function sendDoubaoPcmBytes(bytes, sampleRate = 16000) {
  if (!doubaoSocket || doubaoSocket.readyState !== WebSocket.OPEN || !bytes.length) return;
  const frameBytes = Math.max(2, Math.round(sampleRate * 0.2) * 2);
  const merged = new Uint8Array(doubaoPcmBuffer.length + bytes.length);
  merged.set(doubaoPcmBuffer);
  merged.set(bytes, doubaoPcmBuffer.length);
  let offset = 0;
  while (offset + frameBytes <= merged.length) {
    sendDoubaoAudioFrame(merged.subarray(offset, offset + frameBytes));
    offset += frameBytes;
  }
  doubaoPcmBuffer = merged.slice(offset);
}

function flushDoubaoPcmBuffer() {
  if (doubaoPcmBuffer.length) {
    sendDoubaoAudioFrame(doubaoPcmBuffer);
    doubaoPcmBuffer = new Uint8Array(0);
  }
}

function sendDoubaoAudioFrame(bytes) {
  if (!doubaoSocket || doubaoSocket.readyState !== WebSocket.OPEN || !bytes.length) return;
  doubaoSocket.send(bytes);
}

async function handleDoubaoStreamMessage(event, config) {
  if (typeof event.data !== 'string') {
    const bytes = new Uint8Array(await event.data.arrayBuffer?.() || event.data);
    if (!doubaoDiscardPlayback) {
      await playPcm16AudioBytes(
        bytes,
        doubaoOutputSampleRate || config.output_sample_rate || 24000,
      ).catch(error => {
        console.debug('doubao pcm playback skipped', {
          reason: String(error?.message || error),
        });
        return 0;
      });
      if (doubaoTurnHadConversation) {
        scheduleDoubaoStreamClose(Math.max(900, doubaoQueuedPlaybackMs() + 300));
      }
    }
    return;
  }
  let payload;
  try {
    payload = JSON.parse(event.data);
  } catch {
    return;
  }
  if (payload.type === 'audio.output_config') {
    doubaoOutputSampleRate = payload.sample_rate || 24000;
    return;
  }
  if (payload.type === 'mic.muted_for_tts') {
    doubaoMicMutedForTts = true;
    pauseVoiceSessionSilenceWatch();
    setVoiceState('doubao speaking');
    syncDisplayTtsStart(payload.text || currentTtsDisplayText || conversationState?.reply_text || '');
    return;
  }
  if (payload.type === 'mic.resumed_after_tts') {
    doubaoMicMutedForTts = false;
    setVoiceState('listening');
    const queuedDisplayMs = Math.max(900, doubaoQueuedPlaybackMs() + 300);
    scheduleDisplayAfterSpeech(queuedDisplayMs);
    if (doubaoStreamCaptureActive) scheduleDisplayAudienceResume(queuedDisplayMs + 50);
    if (doubaoStreamCaptureActive) resumeVoiceSessionSilenceWatch(queuedDisplayMs + 50);
    return;
  }
  if (payload.type === 'tts.error') {
    console.error(payload.message || 'doubao tts failed');
    doubaoMicMutedForTts = false;
    setVoiceState('doubao tts failed · mic listening');
    if (doubaoStreamCaptureActive) resumeVoiceSessionSilenceWatch();
    syncDisplayError();
    return;
  }
  if (payload.type === 'asr.partial') {
    pendingTranscript = payload.text || '';
    if (pendingTranscript) {
      markDisplayAudienceSpeaking();
      markVoiceSessionAudienceActivity();
    }
    renderQuestions();
    return;
  }
  if (payload.type === 'asr.final') {
    pendingTranscript = payload.text || '';
    if (pendingTranscript) {
      markDisplayAudienceSpeaking(900);
      markVoiceSessionAudienceActivity();
    }
    const transcriptEl = document.getElementById('visitorTranscript');
    if (transcriptEl) transcriptEl.textContent = pendingTranscript ? `Visitor: ${pendingTranscript}` : '';
    renderQuestions();
    return;
  }
  if (payload.type === 'state' && payload.state === 'session.started') {
    if (payload.conversation) {
      doubaoTurnHadConversation = true;
      await handleConversationResult(payload.conversation, {
        playReplyAudio: false,
        keepVoiceActive: true,
        deferReplyDisplay: true,
      });
    }
    setVoiceState('listening');
    return;
  }
  if (payload.type === 'conversation' && payload.conversation) {
    doubaoTurnHadConversation = true;
    await handleConversationResult(payload.conversation, {
      playReplyAudio: false,
      keepVoiceActive: true,
      deferReplyDisplay: true,
    });
    scheduleDoubaoStreamClose(15000);
    return;
  }
  if (payload.type === 'score' && payload.food_allocation) {
    renderAssignment(payload.food_allocation);
    await refreshQueue();
    return;
  }
  if (payload.type === 'error') {
    console.error(payload.message || 'doubao stream unavailable');
    setVoiceState('doubao stream unavailable');
    releaseDoubaoStreamResources('server_error');
    document.getElementById('voiceBtn').disabled = false;
    document.getElementById('stopVoiceBtn').disabled = true;
    syncDisplayError();
    return;
  }
}

function scheduleDoubaoStreamClose(delayMs) {
  clearTimeout(doubaoCloseTimer);
  doubaoCloseTimer = null;
  if (doubaoStreamCaptureActive) return;
  doubaoCloseTimer = setTimeout(() => {
    releaseDoubaoStreamResources('turn_complete');
  }, delayMs);
}

function stopDoubaoCaptureOnly() {
  doubaoStreamCaptureActive = false;
  stopVoiceSessionSilenceWatch();
  setDisplayAudienceSpeaking(false);
  if (doubaoProcessor) {
    try { doubaoProcessor.disconnect(); } catch {}
    doubaoProcessor.onaudioprocess = null;
  }
  if (doubaoSource) {
    try { doubaoSource.disconnect(); } catch {}
  }
  if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
  if (doubaoInputContext) doubaoInputContext.close().catch(() => {});
  doubaoProcessor = null;
  doubaoSource = null;
  doubaoInputContext = null;
  mediaStream = null;
}

function releaseDoubaoStreamResources(reason = 'user_cancel') {
  clearTimeout(doubaoCloseTimer);
  doubaoCloseTimer = null;
  stopVoiceSessionSilenceWatch();
  clearDisplaySpeechFallback();
  clearDisplayAfterSpeechTimer();
  clearDisplayAudienceResumeTimer();
  currentTtsDisplayText = '';
  clearDoubaoInterruptResetTimer();
  stopDoubaoPlayback(reason);
  stopDoubaoCaptureOnly();
  if (doubaoSocket) {
    doubaoStreamClosing = true;
    if (doubaoSocket.readyState === WebSocket.OPEN) {
      try { doubaoSocket.send(JSON.stringify({ type: 'session.cancel', reason })); } catch {}
    }
    try { doubaoSocket.close(); } catch {}
  }
  doubaoSocket = null;
  doubaoTurnHadConversation = false;
  doubaoDiscardPlayback = false;
  doubaoMicMutedForTts = false;
  doubaoPcmBuffer = new Uint8Array(0);
  doubaoPlaybackStartedAt = 0;
  doubaoLastMicRms = 0;
  doubaoPlaybackSpeechFrames = 0;
  doubaoAudienceSpeechFrames = 0;
}

function downsampleToPcm16Bytes(input, inputSampleRate, outputSampleRate) {
  const ratio = inputSampleRate / outputSampleRate;
  const outputLength = Math.max(0, Math.floor(input.length / ratio));
  const buffer = new ArrayBuffer(outputLength * 2);
  const view = new DataView(buffer);
  for (let index = 0; index < outputLength; index += 1) {
    const start = Math.floor(index * ratio);
    const end = Math.min(input.length, Math.floor((index + 1) * ratio));
    let sum = 0;
    const count = Math.max(1, end - start);
    for (let sourceIndex = start; sourceIndex < end; sourceIndex += 1) {
      sum += input[sourceIndex];
    }
    const sample = Math.max(-1, Math.min(1, sum / count));
    view.setInt16(index * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
  }
  return new Uint8Array(buffer);
}

function silentPcm16Bytes(inputLength, inputSampleRate, outputSampleRate) {
  const ratio = inputSampleRate / outputSampleRate;
  const outputLength = Math.max(0, Math.floor(inputLength / ratio));
  return new Uint8Array(outputLength * 2);
}

async function playPcm16AudioBytes(bytes, sampleRate = 24000) {
  if (bytes.length < 2) return 0;
  const context = ensureDoubaoPlaybackContext();
  await context.resume?.();
  if (context.state === 'suspended') {
    throw new Error('audio context suspended');
  }
  const sampleCount = Math.floor(bytes.length / 2);
  const audioBuffer = context.createBuffer(1, sampleCount, sampleRate);
  const channel = audioBuffer.getChannelData(0);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  for (let index = 0; index < sampleCount; index += 1) {
    channel[index] = view.getInt16(index * 2, true) / 32768;
  }
  const source = context.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(context.destination);
  const startAt = Math.max(context.currentTime, doubaoPlaybackTime);
  const wasPlaybackIdle = doubaoPlaybackSources.size === 0;
  doubaoPlaybackSources.add(source);
  if (wasPlaybackIdle) doubaoPlaybackStartedAt = performance.now();
  source.onended = () => {
    doubaoPlaybackSources.delete(source);
    if (!doubaoPlaybackSources.size) {
      doubaoPlaybackStartedAt = 0;
      doubaoPlaybackSpeechFrames = 0;
    }
  };
  source.start(startAt);
  doubaoPlaybackTime = startAt + audioBuffer.duration;
  return audioBuffer.duration * 1000;
}

function evaluateDoubaoMicFrame(input) {
  const rms = floatRms(input);
  doubaoLastMicRms = rms;
  if (rms >= DOUBAO_STREAM.audienceActivityRms) {
    doubaoAudienceSpeechFrames += 1;
  } else {
    doubaoAudienceSpeechFrames = 0;
  }
  if (doubaoAudienceSpeechFrames >= DOUBAO_STREAM.audienceActivityFrames) {
    markVoiceSessionAudienceActivity();
  }
  if (!doubaoPlaybackSources.size || doubaoDiscardPlayback) {
    doubaoPlaybackSpeechFrames = 0;
    return { mask: false, interrupt: false };
  }

  if (rms >= DOUBAO_STREAM.playbackMicForwardRms) {
    doubaoPlaybackSpeechFrames += 1;
  } else {
    doubaoPlaybackSpeechFrames = 0;
  }

  const userLikelySpeaking =
    doubaoPlaybackSpeechFrames >= DOUBAO_STREAM.playbackMicForwardFrames;
  return {
    mask: !userLikelySpeaking,
    interrupt: DOUBAO_STREAM.localInterruptEnabled && userLikelySpeaking,
  };
}

function interruptDoubaoPlayback(reason) {
  const now = performance.now();
  stopDoubaoPlayback(reason);
  doubaoDiscardPlayback = true;
  scheduleDoubaoInterruptReset();
  clearTimeout(doubaoCloseTimer);
  doubaoCloseTimer = null;
  if (
    doubaoSocket &&
    doubaoSocket.readyState === WebSocket.OPEN &&
    now - doubaoLastInterruptAt > 450
  ) {
    doubaoLastInterruptAt = now;
    try {
      doubaoSocket.send(JSON.stringify({ type: 'barge_in', reason }));
    } catch (error) {
      console.debug('doubao interrupt send failed', {
        reason: String(error?.message || error),
      });
    }
  }
}

function scheduleDoubaoInterruptReset() {
  clearDoubaoInterruptResetTimer();
  doubaoInterruptResetTimer = setTimeout(() => {
    doubaoDiscardPlayback = false;
    doubaoInterruptResetTimer = null;
  }, DOUBAO_STREAM.interruptResetMs);
}

function clearDoubaoInterruptResetTimer() {
  if (doubaoInterruptResetTimer) clearTimeout(doubaoInterruptResetTimer);
  doubaoInterruptResetTimer = null;
}

function stopDoubaoPlayback(reason = 'stop') {
  for (const source of doubaoPlaybackSources) {
    try { source.stop(0); } catch {}
  }
  doubaoPlaybackSources.clear();
  doubaoPlaybackStartedAt = 0;
  doubaoPlaybackSpeechFrames = 0;
  if (doubaoPlaybackContext && doubaoPlaybackContext.state !== 'closed') {
    doubaoPlaybackTime = doubaoPlaybackContext.currentTime || 0;
  } else {
    doubaoPlaybackTime = 0;
  }
  console.debug('doubao playback stopped', { reason });
}

function doubaoQueuedPlaybackMs() {
  if (!doubaoPlaybackContext || doubaoPlaybackContext.state === 'closed') return 0;
  return Math.max(0, (doubaoPlaybackTime - doubaoPlaybackContext.currentTime) * 1000);
}

function floatRms(input) {
  let sum = 0;
  for (let index = 0; index < input.length; index += 1) {
    sum += input[index] * input[index];
  }
  return Math.sqrt(sum / Math.max(1, input.length));
}

function ensureDoubaoPlaybackContext() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) throw new Error('doubao stream unavailable');
  if (!doubaoPlaybackContext || doubaoPlaybackContext.state === 'closed') {
    doubaoPlaybackContext = new AudioCtx();
    doubaoPlaybackTime = doubaoPlaybackContext.currentTime || 0;
  }
  return doubaoPlaybackContext;
}

function unlockDoubaoPlaybackForGesture() {
  try {
    const context = ensureDoubaoPlaybackContext();
    const buffer = context.createBuffer(1, 1, context.sampleRate || 24000);
    const source = context.createBufferSource();
    source.buffer = buffer;
    source.connect(context.destination);
    source.start(0);
    context.resume?.().catch(error => {
      console.debug('doubao audio unlock failed', {
        reason: String(error?.message || error),
      });
    });
  } catch (error) {
    console.debug('doubao audio context unavailable', {
      reason: String(error?.message || error),
    });
  }
}

function stopVoiceSession() {
  if (doubaoSocket && doubaoSocket.readyState === WebSocket.OPEN && doubaoStreamCaptureActive) {
    finishDoubaoStreamSession();
    return;
  }
  voiceRunActive = false;
  cancelVoiceResources('user_cancel');
  document.getElementById('stopVoiceBtn').disabled = true;
  if (currentParticipant) document.getElementById('voiceBtn').disabled = false;
}

function cancelVoiceResources(reason = 'user_cancel') {
  stopVoiceSessionSilenceWatch();
  clearVadHelpers();
  setDisplayAudienceSpeaking(false);
  releaseDoubaoStreamResources(reason);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    recordingCancelled = true;
    recordingStopReason = reason;
    recordingStopRequested = true;
    try { mediaRecorder.stop(); } catch { releaseAudioOnlyResources(); }
  } else {
    releaseAudioOnlyResources();
  }
}

async function startFileRecording() {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    setVoiceState('browser voice unavailable');
    return;
  }
  cancelVoiceResources('user_cancel');
  setVoiceState('requesting mic');

  try {
    document.getElementById('voiceBtn').disabled = true;
    document.getElementById('stopVoiceBtn').disabled = false;
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (error) {
    console.error(error);
    setVoiceState('mic permission denied');
    stopVoiceSession();
    return;
  }

  try {
    activeRecordingMimeType = preferredRecordingMimeType();
    const options = activeRecordingMimeType ? { mimeType: activeRecordingMimeType } : {};
    mediaRecorder = new MediaRecorder(mediaStream, options);
    audioChunks = [];
    recordingCancelled = false;
    recordingStopReason = 'recording';
    recordingStopRequested = false;
    recordingStartedAt = performance.now();
    mediaRecorder.addEventListener('dataavailable', event => {
      if (event.data && event.data.size) audioChunks.push(event.data);
    });
    mediaRecorder.addEventListener('stop', handleFileRecordingStop, { once: true });
    mediaRecorder.start(200);
    setVoiceState('recording');
    setDisplayAudienceSpeaking(true);
    startVoiceSessionSilenceWatch();
    console.debug('voice recording started', {
      mime_type: activeRecordingMimeType || mediaRecorder.mimeType || 'default',
    });
  } catch (error) {
    console.error(error);
    setVoiceState('recording failed');
    cancelVoiceResources('user_cancel');
    return;
  }

  try {
    startVadMonitor();
  } catch (error) {
    console.debug('voice vad unavailable; using fallback timer', {
      reason: String(error?.message || error),
    });
    startVadFallbackTimer('vad_failed_fallback_timeout');
  }
}

function preferredRecordingMimeType() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4',
    'audio/mpeg',
    'audio/wav',
  ];
  return candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
}

function startVadMonitor() {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioContext.createMediaStreamSource(mediaStream);
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  const data = new Uint8Array(analyser.fftSize);
  const samples = [];
  let noiseFloor = 0.02;
  let threshold = 0.05;
  let calibrated = false;
  let speechStartedAt = null;
  let lastSpeechAt = null;
  let speechMs = 0;
  let lastFrameAt = performance.now();

  const tick = () => {
    try {
      if (!analyser || !mediaRecorder || mediaRecorder.state === 'inactive') return;
      const now = performance.now();
      const elapsed = now - recordingStartedAt;
      const delta = now - lastFrameAt;
      lastFrameAt = now;
      const rms = currentRms(analyser, data);

      if (!calibrated) {
        samples.push(rms);
        if (elapsed >= VAD.calibrationMs) {
          const avg = samples.reduce((sum, item) => sum + item, 0) / Math.max(samples.length, 1);
          noiseFloor = Math.max(avg, 0.012);
          threshold = Math.max(0.035, noiseFloor + 0.025, noiseFloor * 2.2);
          calibrated = true;
          console.debug('voice vad calibrated', { noise_floor: noiseFloor, threshold });
        }
        vadFrame = requestAnimationFrame(tick);
        return;
      }

      const speaking = rms > threshold;
      if (speaking) {
        markDisplayAudienceSpeaking();
        markVoiceSessionAudienceActivity();
        if (speechStartedAt === null) speechStartedAt = now;
        lastSpeechAt = now;
        speechMs += delta;
      }

      if (speechStartedAt === null && elapsed >= VAD.noSpeechTimeoutMs) {
        handleVoiceSessionSilenceTimeout();
        return;
      }
      if (speechStartedAt !== null && elapsed >= VAD.maxRecordingMs) {
        stopRecordingForUpload('max_duration');
        return;
      }
      if (
        speechStartedAt !== null &&
        speechMs >= VAD.minSpeechMs &&
        lastSpeechAt !== null &&
        now - lastSpeechAt >= VAD.silenceMs
      ) {
        stopRecordingForUpload('vad_silence');
        return;
      }
      vadFrame = requestAnimationFrame(tick);
    } catch (error) {
      console.debug('voice vad failed during recording; using fallback timer', {
        reason: String(error?.message || error),
      });
      startVadFallbackTimer('vad_failed_fallback_timeout');
    }
  };
  vadFrame = requestAnimationFrame(tick);
}

function currentRms(node, data) {
  node.getByteTimeDomainData(data);
  let sum = 0;
  for (const value of data) {
    const centered = (value - 128) / 128;
    sum += centered * centered;
  }
  return Math.sqrt(sum / data.length);
}

function stopRecordingForUpload(reason = 'manual_finish') {
  if (!mediaRecorder || mediaRecorder.state === 'inactive' || recordingStopRequested) return;
  recordingCancelled = false;
  recordingStopReason = reason;
  recordingStopRequested = true;
  clearVadHelpers();
  stopVoiceSessionSilenceWatch();
  setDisplayAudienceSpeaking(false);
  setVoiceState('stopping');
  console.debug('voice recording stopping', { reason });
  try { mediaRecorder.requestData(); } catch {}
  try {
    mediaRecorder.stop();
  } catch (error) {
    console.debug('voice recorder stop failed', { reason: String(error?.message || error) });
    releaseAudioOnlyResources();
    setVoiceState('没太听清，请再说一遍');
  }
}

function startVadFallbackTimer(reason) {
  if (vadFrame) cancelAnimationFrame(vadFrame);
  vadFrame = null;
  if (vadFallbackTimer) clearTimeout(vadFallbackTimer);
  const elapsed = performance.now() - recordingStartedAt;
  const remaining = Math.max(0, VAD.maxRecordingMs - elapsed);
  vadFallbackTimer = setTimeout(() => stopRecordingForUpload(reason), remaining);
}

function clearVadHelpers() {
  if (vadFrame) cancelAnimationFrame(vadFrame);
  if (vadFallbackTimer) clearTimeout(vadFallbackTimer);
  vadFrame = null;
  vadFallbackTimer = null;
}

function resetRecordingState() {
  recordingCancelled = false;
  recordingStopReason = 'idle';
  recordingStopRequested = false;
  activeRecordingMimeType = '';
}

async function handleFileRecordingStop() {
  const cancelled = recordingCancelled;
  const stopReason = recordingStopReason || 'unknown';
  const chunks = audioChunks.slice();
  const mimeType = activeRecordingMimeType || chunks[0]?.type || 'audio/webm';
  const durationMs = Math.round(performance.now() - recordingStartedAt);
  clearVadHelpers();
  releaseAudioOnlyResources();
  mediaRecorder = null;
  audioChunks = [];
  document.getElementById('stopVoiceBtn').disabled = true;
  const debugData = {
    reason: stopReason,
    chunks: chunks.length,
    duration_ms: durationMs,
    mime_type: mimeType,
  };
  if (cancelled || stopReason === 'user_cancel') {
    console.debug('voice recording discarded', debugData);
    resetRecordingState();
    return;
  }
  if (!chunks.length) {
    console.debug('voice recording stopped with no chunks', debugData);
    resetRecordingState();
    setVoiceState('没太听清，请再说一遍');
    document.getElementById('voiceBtn').disabled = false;
    return;
  }
  const blob = new Blob(chunks, { type: mimeType });
  console.debug('voice recording ready to upload', {
    ...debugData,
    blob_size: blob.size,
  });
  resetRecordingState();
  await submitAudioBlob(blob, mimeType, durationMs);
}

function releaseAudioOnlyResources() {
  if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
  if (audioContext) audioContext.close().catch(() => {});
  mediaStream = null;
  audioContext = null;
  analyser = null;
}

async function submitAudioBlob(blob, mimeType, durationMs) {
  if (!currentParticipant) return;
  setVoiceState('uploading audio');
  try {
    const audioBase64 = await blobToBase64(blob);
    const result = await api(
      `/api/v1/participants/${currentParticipant.id}/conversation-audio`,
      {
        method: 'POST',
        body: JSON.stringify({
          audio_base64: audioBase64,
          mime_type: mimeType,
          duration_ms: durationMs,
          attempt_id: makeAttemptId('conversation'),
          detected_language: responseLanguage || null,
          include_audio: true,
        }),
      },
    );
    await handleConversationResult(result);
  } catch (error) {
    console.error(error);
    setVoiceState('stt upload failed');
    document.getElementById('voiceBtn').disabled = false;
    syncDisplayError();
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const value = String(reader.result || '');
      resolve(value.includes(',') ? value.split(',', 2)[1] : value);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function makeAttemptId(questionId) {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return `${questionId}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

async function submitManualTranscript() {
  const transcript = document.getElementById('manualTranscript').value.trim();
  if (!transcript) return;
  unlockDoubaoPlaybackForGesture();
  document.getElementById('manualTranscript').value = '';
  await submitTranscript(transcript);
}

async function submitLanguageChoice(choice) {
  if (!currentParticipant || conversationState?.stage !== 'language_gate') return;
  unlockDoubaoPlaybackForGesture();
  await submitTranscript(choice);
}

async function submitTranscript(transcript) {
  if (!currentParticipant) return;
  setVoiceState('interpreting');
  const config = await getVoiceConfig().catch(() => null);
  const useDoubaoStream = isDoubaoStreamConfig(config);
  const result = await api(`/api/v1/participants/${currentParticipant.id}/conversation-turn`, {
    method: 'POST',
    body: JSON.stringify({
      transcript,
      include_audio: !useDoubaoStream,
    }),
  });
  await handleConversationResult(result, {
    playReplyAudio: !useDoubaoStream,
    deferReplyDisplay: useDoubaoStream,
  });
  if (useDoubaoStream && result.reply_text) {
    await playDoubaoStreamReplyText(result.reply_text, config).catch(error => {
      console.error(error);
      setVoiceState('doubao stream unavailable');
    });
  }
}

async function handleConversationResult(result, options = {}) {
  const {
    playReplyAudio = true,
    keepVoiceActive = false,
    deferReplyDisplay = false,
  } = options;
  conversationState = result;
  if (result.response_language) responseLanguage = result.response_language;
  pendingTranscript = '';
  renderConversation(result);
  if (!result.participant_deleted) {
    await refreshParticipantDetail();
  }
  if (result.assignment) {
    renderAssignment(result.assignment);
    await refreshQueue();
  }
  if (!result.assignment && result.reply_text && !deferReplyDisplay) {
    if (shouldShowQuestionDuringTts()) {
      syncDisplayQuestion(true);
    } else {
      syncDisplayRobotSpeaking(result.reply_text);
    }
  } else if (!result.assignment) {
    if (deferReplyDisplay && doubaoMicMutedForTts) {
      syncDisplayCurrentTtsSpeaking();
    } else {
      syncDisplayQuestion();
    }
  }
  syncDisplayFormalAnswerGreeting(result);
  setVoiceState(`${result.stage} · ${result.answered_count}/${result.total_questions}`);
  if (playReplyAudio && result.reply_audio_base64) {
    await playAudioBase64(
      result.reply_audio_base64,
      result.reply_audio_mime_type || 'audio/mpeg',
      'reply playback failed',
    ).catch(error => {
      console.debug('conversation reply playback skipped', {
        reason: String(error?.message || error),
      });
    });
    syncDisplayAfterSpeech();
  } else if (result.reply_text && !keepVoiceActive && !deferReplyDisplay) {
    window.setTimeout(syncDisplayAfterSpeech, 2200);
  }
  if (result.participant_deleted || result.next_action === 'end_session') {
    voiceRunActive = false;
    document.getElementById('stopVoiceBtn').disabled = true;
    document.getElementById('voiceBtn').disabled = true;
    document.getElementById('manualSubmitBtn').disabled = true;
    if (!result.assignment) scheduleDisplayStandby(3600);
    return;
  }
  if (keepVoiceActive) {
    voiceRunActive = true;
    document.getElementById('stopVoiceBtn').disabled = false;
    document.getElementById('voiceBtn').disabled = true;
    document.getElementById('manualSubmitBtn').disabled = true;
    return;
  }
  voiceRunActive = false;
  document.getElementById('stopVoiceBtn').disabled = true;
  document.getElementById('voiceBtn').disabled = false;
  document.getElementById('manualSubmitBtn').disabled = false;
}

function renderConversation(result) {
  const view = document.getElementById('conversationView');
  view.classList.remove('hidden');
  document.getElementById('conversationStage').textContent =
    `${result.stage} · next=${result.next_action}`;
  document.getElementById('shopkeeperReply').textContent = result.reply_text || '';
  document.getElementById('visitorTranscript').textContent =
    result.transcript ? `Visitor: ${result.transcript}` : '';
  document.getElementById('conversationProgress').textContent =
    `answered=${result.answered_count}/${result.total_questions}`;
  document.getElementById('conversationQuestion').textContent =
    result.current_question_text ? `current: ${result.current_question_text}` : '';
}

async function refreshParticipantDetail() {
  if (!currentParticipant) return;
  const detail = await api(`/api/v1/participants/${currentParticipant.id}`);
  currentQuestions = detail.draws || [];
  voiceAnswers = answersFromDetail(detail);
  activeQuestionIndex = resultQuestionIndex(conversationState) ?? firstUnansweredIndex();
  renderQuestions();
  if (detail.assignment) renderAssignment(detail.assignment);
}

function answersFromDetail(detail) {
  const latestInterpretation = {};
  for (const item of detail.voice_interpretations || []) {
    latestInterpretation[item.question_id] = item;
  }
  const answers = {};
  for (const item of Object.values(latestInterpretation)) {
    answers[item.question_id] = {
      status: item.status,
      option_id: item.inferred_option_id || '',
      confidence: item.llm_confidence ?? '',
      transcript: item.transcript || '',
      reason_zh: item.reason_zh || '',
      reason_en: item.reason_en || '',
      needs_retry: item.status !== 'accepted',
    };
  }
  for (const answer of detail.answers || []) {
    const item = latestInterpretation[answer.question_id] || {};
    answers[answer.question_id] = {
      status: 'accepted',
      option_id: answer.option_id,
      confidence: item.llm_confidence ?? '',
      transcript: item.transcript || '',
      reason_zh: item.reason_zh || '',
      reason_en: item.reason_en || '',
      needs_retry: false,
    };
  }
  return answers;
}

function resultQuestionIndex(result) {
  if (!result?.current_question_id) return null;
  const index = currentQuestions.findIndex(q => q.question_id === result.current_question_id);
  return index === -1 ? null : index;
}

function playAudioBase64(audioBase64, mimeType, errorState) {
  const binary = atob(audioBase64);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) {
    bytes[index] = binary.charCodeAt(index);
  }
  return playAudioBlob(new Blob([bytes], { type: mimeType }), null, errorState);
}

function firstUnansweredIndex() {
  const index = currentQuestions.findIndex(q => voiceAnswers[q.question_id]?.status !== 'accepted');
  return index === -1 ? currentQuestions.length : index;
}

function renderAssignment(assignment) {
  document.getElementById('assignmentBand').classList.remove('hidden');
  document.getElementById('assignmentCode').textContent = currentParticipant.public_code;
  document.getElementById('foodLabel').textContent = assignment.food_label;
  document.getElementById('foodLabelZh').textContent =
    selectedResponseLanguage() === 'en' ? '' : (foodZh[assignment.food_code] || assignment.food_label);
  document.getElementById('scoreLine').textContent =
    `ai_trace=${assignment.ai_trace_score} · relational=${assignment.relational_score}`;
  syncDisplayResult(assignment);
}

async function refreshQueue() {
  const items = await api('/api/v1/staff-queue');
  const body = document.getElementById('queueBody');
  body.innerHTML = items.map(item => `
    <tr>
      <td class="code">${escapeHtml(item.public_code)}</td>
      <td>${escapeHtml(item.final_food_label)}</td>
      <td><span class="pill">${escapeHtml(item.status)}</span></td>
      <td class="row">
        ${item.status === 'pending' ? `<button onclick="queueStatus(${item.id}, 'preparing')">Prep</button>` : ''}
        ${item.status !== 'served' ? `<button class="primary" onclick="queueStatus(${item.id}, 'served')">Served</button>` : ''}
      </td>
    </tr>
  `).join('') || `<tr><td colspan="4" class="muted">Empty.</td></tr>`;
}

async function queueStatus(id, status) {
  await api(`/api/v1/staff-queue/${id}`, {
    method: 'PATCH',
    body: JSON.stringify({ status }),
  });
  await refreshQueue();
}

function setVoiceState(text) {
  document.getElementById('voiceState').textContent = text;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function handleLanguageGateShortcut(event) {
  if (!currentParticipant || conversationState?.stage !== 'language_gate') return;
  const target = event.target;
  if (target?.tagName === 'INPUT' || target?.tagName === 'TEXTAREA' || target?.isContentEditable) {
    return;
  }
  const key = String(event.key || '').toLowerCase();
  if (key === 'e') {
    event.preventDefault();
    submitLanguageChoice('English').catch(error => {
      console.error(error);
      setVoiceState('language selection failed');
    });
  } else if (key === 'c') {
    event.preventDefault();
    submitLanguageChoice('中文').catch(error => {
      console.error(error);
      setVoiceState('language selection failed');
    });
  }
}

document.addEventListener('keydown', handleLanguageGateShortcut);

initializeHardwareButtonControls();
initializeDisplayWakeChannel();
syncDisplayStandby();
pollHealth();
refreshQueue();
setInterval(pollHealth, 4000);
setInterval(refreshQueue, 6000);
</script>
