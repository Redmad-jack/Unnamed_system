[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conscious-entity"
version = "0.1.0"
description = "A minimal artificial entity designed to trigger consciousness attribution"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
vision = [
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
    "ultralytics>=8.3.0",
]
audio = [
    "websockets>=12.0",
]
hardware = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
